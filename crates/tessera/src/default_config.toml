# The layout Tessera uses when %APPDATA%\tessera\config.toml does not exist.
# Copy this file there to change it; Tessera reads it once at startup.

# Name of a theme file, %APPDATA%\tessera\themes\<name>.toml. Optional.
# theme = "example"

# Each [[surface]] is a strip docked to a screen edge.
#   edge       "top" or "bottom"
#   thickness  reserved screen space, in logical pixels
#   displays   "all" (default) or "primary"
#   start, center, end  widgets to place
#
# A widget is its name, or a table: { widget = "name", popup = "name", ... }.
#   popup   the [[popup]] a click on the widget opens; any widget can have one
#   other keys are options of that widget
#
# Built-in widgets:
#   "clock"     date and time; option format, a strftime pattern
#   "calendar"  a month to page through; option week_start, "monday" or "sunday"
#   "volume"    the output volume, as an icon and a percentage
#   "volume-slider"  a mute button and a slider for the output volume
#   "windows"   a button for each open window of the display
#   "quit"      closes Tessera
#   "label"     fixed content; options text and icon, a character of the
#               Segoe Fluent Icons font such as "\uE71D"
#   "launcher"  a search field over the applications of the Start menu;
#               option placeholder, the hint in the empty field

[[surface]]
edge = "top"
thickness = 48
start = [{ widget = "label", icon = "\uE71D", text = "Apps", popup = "launcher" }]
center = [{ widget = "clock", popup = "calendar" }]
end = [{ widget = "volume", popup = "sound" }, "quit"]

[[surface]]
edge = "bottom"
thickness = 76
center = ["windows"]

# Each [[popup]] is a floating panel that opens next to the surface.
#   name           what widgets refer to
#   width, height  size in logical pixels
#   content        widgets, stacked from the top

[[popup]]
name = "launcher"
width = 420
height = 520
content = ["launcher"]

[[popup]]
name = "calendar"
width = 300
height = 348
content = ["calendar"]

[[popup]]
name = "sound"
width = 340
height = 76
content = ["volume-slider"]

# [icons] replaces application icons. Each key is the file name of an
# executable, each value an image file (PNG, JPEG or ICO); a relative path is
# looked up in %APPDATA%\tessera.
#
# [icons]
# "notepad.exe" = "icons/notepad.png"

# [extension.<id>] holds the settings of the extension with that id; the
# extension decides which keys it understands.
#
# [extension.ai-limits]
# providers = ["claude", "codex"]
