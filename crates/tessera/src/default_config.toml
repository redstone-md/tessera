# The layout Tessera uses when %APPDATA%\tessera\config.toml does not exist.
# Copy this file there to change it; Tessera applies it again whenever it is written.

# Name of a theme file, %APPDATA%\tessera\themes\<name>.toml. Optional.
# The name "accent" is no file: it derives the colors from the accent color
# of the Windows settings, dark or light as those settings say for the
# taskbar, and follows both when they change. A theme file may hold
#   seed = "#rrggbb"    a color to derive all colors from, or "accent"
#   scheme = "light"    "dark" (default), "light" or "system"
#   [colors]            single roles as "#rrggbb", applied last
# theme = "example"

# Colors that are read (text, icons, the accent, outlines) are made lighter
# or darker by as little as gives them the contrast WCAG 2.1 asks for at
# level AA to the surfaces of the theme: 4.5 to 1, outlines 3 to 1. Colors
# that already have it stay. `false` leaves a theme exactly as written.
# Where a theme leaves out the fields behind the widgets of a bar
# (`flat`), the bar looks at the desktop under it every few seconds, and
# a widget whose text does not have that contrast to the desktop there
# gets its field back.
# contrast = false

# The language of the settings, the marketplace, the calendar, the lists of
# notifications and problems and the names of days and months in the clock: "en" (default), "ru",
# or the name of a file of the `languages` directory next to this file, or
# of the one beside tessera.exe, without `.toml`.
# What the widgets of the bars say stays English.
# language = "ru"

# The registries the "marketplace" widget reads: https addresses or absolute
# paths of registry files. Without the key it is the registry of the Tessera
# repository; an empty list reads none.
# registries = ["https://example.org/registry.toml"]

# The [[popup]] the Windows key opens and closes when it is pressed by itself,
# instead of the Start menu of Windows. Combinations with the key stay as
# they are. Without the key in this file, the Windows key is left to Windows.
# windows_key = "launcher"

# Whether the keys of Windows that features of Tessera bring to their
# actions are bound, where no [[key]] below presses the same keys. Without
# the key in this file they are bound only when Tessera is the shell of the
# session. The keys they bring are named with the actions below.
# windows_keys = true

# Each [[key]] is a key combination Tessera answers wherever it is pressed.
# press names it: keys to hold among alt, ctrl, shift and win, then the key
# to press, joined by +; that key is a digit, a letter, f1 to f24, space,
# tab, enter, left, up, right, down, home, end, pageup, pagedown, insert,
# delete, backspace, escape, pause, printscreen, or the keys of period,
# comma, plus, minus and backquote (where a US layout has them). No program
# gets the combination while Tessera holds it, and one that Windows or
# another program holds already is reported and does nothing. Each [[key]]
# has one of:
#   popup   the [[popup]] to open, or to close when it is open
#   tiling  "next" for the tiling mode after the one in use, "off", a
#           layout of [tiling], or "float", which takes the window in front
#           out of the tiles, back to where it was, and puts it in again
#           when pressed once more, or "wider" or "narrower", which give
#           the first window of "master" a twentieth of the width more or
#           less, between a fifth and four fifths, until Tessera exits;
#           the first window of "columns" and "rows" grows and shrinks
#           against the others likewise, and with another window of
#           those two layouts in front it is that window that grows and
#           shrinks against the others after the first
#   run     a program to start and its arguments, a list
#   focus   "left", "right", "up" or "down": the window on that side of the
#           window in front comes in front, among the windows [tiling]
#           covers, tiled or not
#   move    one of those sides: the window in front trades tiles with the
#           window on that side of it on its display, while tiling is on
#   switch  "next" or "previous": the window switcher opens in the middle of
#           the display the pointer is on, with the windows of all displays,
#           the one used last first; each further press while the keys to
#           hold stay down goes one window on (or back), and letting them go
#           brings the chosen window in front. The arrow keys move the
#           choice as well, Enter takes it and Esc closes the switcher
#           with nothing brought in front. Windows gives alt+tab to
#           no program, so Tessera takes keys it is refused from the keyboard
#           itself, and the switcher of Windows no longer opens for them
#   dock    1 to 9: what a click on the button of the application with that
#           number does, counted from the first application in the "windows"
#           widget of the display the pointer is on: a pinned one without a
#           window starts, and the windows of the others are gone through.
#           Windows keeps the Windows key with a digit to itself as well,
#           so such keys are taken from the keyboard like those of switch
#
# [[key]]
# press = "ctrl+alt+space"
# popup = "launcher"
#
# [[key]]
# press = "ctrl+alt+t"
# tiling = "next"
#
# [[key]]
# press = "ctrl+alt+enter"
# run = ["wt.exe"]
#
# [[key]]
# press = "alt+left"
# focus = "left"
#
# [[key]]
# press = "alt+shift+left"
# move = "left"
#
# [[key]]
# press = "alt+tab"
# switch = "next"
#
# [[key]]
# press = "alt+shift+tab"
# switch = "previous"
#
# [[key]]
# press = "win+1"
# dock = 1
#
#   files   a folder to open in the file manager of Tessera: a path, "~"
#           for the folder of the user, or "computer" for the drives
#
# [[key]]
# press = "win+e"
# files = "~"
#
#   action  the name of an action, which the modules of Tessera register;
#           arg is what it is done with, where it takes something. A name
#           no module registered, or an arg the action refuses, is
#           reported like any other mistake. `tessera do <action> [arg]`
#           does the same from a console. The actions that come with
#           Tessera are:
#             popup    the popup arg names, as popup above; its keys are
#                      taken from Windows where it keeps them, as win+v
#             desktop  shows the desktop, or brings the windows back, as
#                      the widget desktop does; win+d is taken from Windows
#                      arg "minimize" minimizes every window (win+m),
#                      "restore" brings them back (win+shift+m), "others"
#                      minimizes all but the one in front (win+home)
#             files    the file manager, at the folder arg names as files
#                      above does (the folder of the user without one);
#                      win+e is taken from Windows
#             trash    has Explorer open the Recycle Bin, as the widget
#                      trash does; arg "restore" brings every item back
#                      once the user said yes, "empty" empties it once
#                      Windows has asked
#             run      the Run dialog, the popup "run"; win+r is taken from
#                      Windows, and bound to it with the keys of Windows
#             runner   the compact runner, the popup "runner"; it brings no
#                      key, as alt+space is the window menu of Windows
#
# [[key]]
# press = "alt+space"
# action = "runner"
#
# [[key]]
# press = "win+r"
# action = "run"
#             winx     the menu of Win+X (win+x): the tools of Windows,
#                      the settings, the file manager, search, Run, shut
#                      down or sign out and the desktop, each taken by
#                      its letter as in Windows; it opens at the widget
#                      winx, else at the Start button (the button that
#                      opens "launcher"), else at the left end of a bar
#             power-dialog  the dialog that asks what the computer is
#                      to do: switch user, sign out, sleep, hibernate,
#                      shut down, restart, and while updates of Windows
#                      wait, update and shut down or update and restart;
#                      nothing is done before OK. It brings no key:
#                      where windows_keys is on, alt+f4 opens it while
#                      the desktop is in front
#             display-mode  the choice of Win+P (win+p): PC screen only,
#                      duplicate, extend or second screen only; arg
#                      "pc-screen-only", "duplicate", "extend" or
#                      "second-screen-only" switches at once
#             input-language  asks the window in front for the next
#                      keyboard layout (win+space); arg "previous" for
#                      the one before (win+shift+space), "list" opens the
#                      popup keyboard-list
#             open     opens what arg names through the Shell, as a
#                      double click would: win+i "ms-settings:", win+u
#                      "ms-settings:easeofaccess", win+k
#                      "ms-settings-connectabledevices:devicediscovery",
#                      win+g "ms-gamebar:", win+shift+s "ms-screenclip:"
#                      and win+pause "ms-settings:about"
#             start, search, quick-settings, notification-center
#                      the popup arg names, or without one "launcher"
#                      (start: ctrl+escape; search: win+s and win+q),
#                      "quick-settings" (win+a), which the module brings,
#                      and "calendar" (win+n)
#             screenshot  saves a picture of all displays as
#                      Screenshot (N).png in Pictures\Screenshots, N
#                      counted on as Windows counts (win+printscreen)
#             dock     what dock above does with the number arg names,
#                      1 to 9; it brings no key
#           The keys in brackets are bound to the actions where
#           windows_keys is on (see above), unless a [[key]] presses the
#           same keys, and they are taken from Windows. win+l,
#           ctrl+shift+escape and the keys that switch the input language
#           (alt+shift, ctrl+shift) stay with Windows; so does win+period,
#           whose emoji panel Tessera does not open.
#             snap     snaps the window in front, as [snap] below says:
#                      arg "left", "right", "up" or "down" goes from a half
#                      to a quarter, to the whole display and back as
#                      win+arrows do; "left-half", "right-half",
#                      "top-left", "top-right", "bottom-left",
#                      "bottom-right" and "maximize" go there at once,
#                      "restore" and "minimize" do that. Where the keys of
#                      Windows are bound it brings win+left, win+right,
#                      win+up and win+down
#             snap-display  sends the window in front to the next display,
#                      arg "next" (the default) or "previous"; brings
#                      win+shift+right and win+shift+left
#             snap-layouts  opens the snap layouts for the window in front;
#                      brings win+z
#             window-menu  opens the window menu of the window in front:
#                      keep above, opacity, workspace, display, snap,
#                      maximize, minimize, close, and a [[rule]] written
#                      for it; brings alt+f3
#             quiet    do not disturb: arg "on", "off", "morning" (until
#                      eight), a number of minutes, or "toggle" as without
#                      one
#             notify   posts a notice of Tessera's own: arg is its title,
#                      and after " | " its text
#             clipboard  the history of the clipboard in the popup
#                      "clipboard", to paste from into the window in front
#                      (see [clipboard] below); win+v is taken from Windows
#                      and is its key where windows_keys binds such keys
#                      and [clipboard] has the history on at the start
#             night-light  night light on with arg "on", off with "off",
#                      switched over with "toggle" or without arg
#             volume   arg "up" or "down" turns the default output a step,
#                      "mute" mutes it or lifts the mute, "mute-microphone"
#                      does that to the default microphone
#             brightness  arg "up" or "down": the display under the pointer
#                      a tenth brighter or darker
#             media    arg "toggle", "play", "pause", "stop", "next" or
#                      "previous", for the player media-controls shows
#             eject    the drive whose letter arg names, as "E", as its
#                      Eject button in the popup "devices" does
#             switcher the window switcher, as switch above, until the
#                      keys to hold of its press are let go (with none, or
#                      done by `tessera do`, it stays open until a window
#                      is chosen); arg "next" (or none) and "previous" go
#                      through all the windows it offers, "app-next" and
#                      "app-previous" through those of the application of
#                      the window in front, as alt+backquote does on other
#                      desktops. Where the keys of Windows are in use
#                      (windows_keys, or Tessera being the shell) it takes
#                      alt+tab, alt+shift+tab, alt+backquote (app-next) and
#                      alt+shift+backquote (app-previous) unless a [[key]]
#                      presses them
#
# [[key]]
# press = "win+v"
# action = "popup"
# arg = "clipboard"
#
# [[key]]
# press = "win+d"
# action = "desktop"
#
# [[key]]
# press = "win+shift+delete"
# action = "trash"
# arg = "empty"
# press = "win+a"
# action = "popup"
# arg = "quick-settings"
#
# [[key]]
# press = "ctrl+alt+n"
# action = "night-light"
# press = "alt+backquote"
# action = "switcher"
# arg = "app-next"

# The file manager of Tessera, which `tessera files [folder]`, the widget
# `files` and the key above open. It reads folders without Explorer, opens
# files with their programs, and has the Shell copy, move and delete, so
# its dialogs, the Recycle Bin and Undo work as in Explorer.
#   own            whether the folders the user menu and the launcher open
#                  open here instead of in Explorer (true)
#   hidden         whether hidden and system files are shown (false)
#   folders_first  whether folders stand before files (true)
#   view           "details" (default) or "tiles"
#                  "list" or "icons" (large icons) too; "tiles" shows the
#                  type and size beside each icon, as Explorer's tiles do
#   group          what a folder is first grouped by: "none" (default),
#                  "type" or "date"
#   per_folder     whether each folder keeps its own look, zoom, order and
#                  groups, as last set there (false)
#   restore        whether a window opened without a folder opens with the
#                  tabs of the last window closed (false)
#   explorer       whether the folder options of Explorer are followed:
#                  hidden extensions, hidden and protected files, and the
#                  names a desktop.ini gives (true)
# [files]
# own = true
# view = "details"
# group = "none"
# per_folder = false
# restore = false
# explorer = true

# [shell] says what Tessera does as the shell of the session, in the place of
# Explorer (`tessera shell install` makes it that at the next sign-in,
# `tessera shell revert` gives it back; see docs/SHELL.md). Beside Explorer
# it changes nothing.
#   emergency_keys    whether Ctrl+Win+Alt+E starts Task Manager and hands the
#                     session to Explorer, and Ctrl+Win+Alt+R starts Tessera
#                     again (true)
#   quit_to_explorer  whether Tessera that quits starts Explorer as the shell,
#                     so the session keeps one (true)
#   media_keys        whether the keys of the volume, of the microphone and
#                     of media run the actions volume and media, with their
#                     flyouts, as Explorer has them (true)
# [shell]
# emergency_keys = true
# quit_to_explorer = true
# media_keys = true
# [startup] says what Tessera does, when it is the shell of the session,
# about the programs that start with the session; beside Explorer it starts
# none of them, Explorer does. Once per session, delay seconds after the
# bars opened, it runs the newer components of Active Setup, RunOnce of the
# machine (where it may delete its values), Run and Policies\Explorer\Run
# of the machine and of the user, the Startup folders, RunOnce of the user
# and the startup tasks of Store apps, leaving out what was switched off in
# Task Manager or in the settings (General, Startup apps).
#   run           whether it starts them at all (true)
#   delay         seconds after the bars opened (2)
#   active_setup  whether the components of Active Setup run first (true)
#   packaged      whether the startup tasks of Store apps start (true)
# [startup]
# run = true
# delay = 2

# [clipboard] has Tessera keep a history of the clipboard while it runs:
# texts, lists of files and pictures, newest first, to paste again from
# the popup "clipboard" (the action clipboard, as win+v, opens it). A
# text or files copied again move to the front. Pinned items stay when
# the history is cleared and when Tessera starts again, in clipboard.toml
# of this directory; the others last until Tessera exits. What a program
# marks as not for a history, as password managers do, is not kept, nor
# a text of more than about a million characters or a picture of more
# than 20 megapixels. Rich text is kept as its plain text.
#   enabled  whether what is copied is kept (true); false forgets all but
#            the pinned items, and leaves win+v to Windows from the next
#            start unless a [[key]] gives it to the action clipboard
#   size     how many items are kept besides the pinned ones (25, 1 to 200)
#   images   whether pictures are kept (true); each is a PNG file in
#            cache/clipboard of this directory until it leaves the history
# [clipboard]
# enabled = true
# size = 25
# images = true

# The notices Tessera gives where Explorer would, listed with the
# notifications and shown as banners where [notifications] shows banners
# (urgent ones always, until they are put away). Without a key, each is
# given only while Tessera is the shell of the session.
#   drives   a drive plugged in, or a disc or a card put in, with buttons
#            that open it and eject it
#   battery  warnings at the low, reserve and critical battery levels of
#            the power plan in use; the last two are urgent: they come
#            while do not disturb is on and stay until they are put away
# [notices]
# drives = true
# battery = true

# Each [[surface]] is a strip docked to a screen edge.
#   edge       "top" or "bottom"
#   thickness  reserved screen space, in logical pixels
#   displays   "all" (default) or "primary"
#   hide       true to have the strip slide away while the pointer is
#              elsewhere and come back when the pointer reaches that edge
#              of the display; "overlap" to have it do so only while a
#              window lies where the strip would be. Either way it reserves
#              no screen space
#   start, center, end  widgets to place
#
# A widget is its name, or a table: { widget = "name", popup = "name", ... }.
#   popup   the [[popup]] a click on the widget opens; any widget can have one.
#           A widget of an extension may come with a popup of its own;
#           popup = "" switches that off
#   other keys are options of that widget
#
# Built-in widgets:
#   "clock"     date and time; option format, a strftime pattern
#               and option zones, time zones its tip and the calendar
#               give with their time and offset, as ["Europe/Berlin",
#               "Tokyo", "Eastern Standard Time"]: an IANA identifier, a
#               zone of Windows or a city
#   "calendar"  a month to page through; option week_start, "monday" or "sunday"
#   "notifications"  the notifications Tessera keeps: those of the Windows
#               notification center and the history of those that left it,
#               grouped by application, each with a button that dismisses
#               it; a click on one opens its application. Fills the height
#               left in its popup and scrolls
#   "notifications-button"  a bell with the number of notifications that
#               came since a list of them was last open, a moon while do
#               not disturb holds; a click opens the popup "notifications"
#   "focus"     a switch for do not disturb, with why it holds
#   "clipboard"  the history of the clipboard, for a popup: a search field
#               over what was copied, newest first; Enter or a click pastes
#               the item into the window that was in front, the buttons of
#               a row pin it, delete it or open the web address it is.
#               The popup "clipboard" holds it; see [clipboard] above
#   "clipboard-button"  a button that opens the popup "clipboard"
#   "cpu"       how busy the processors are, as a wavy line and a percentage;
#               option style, "wave" (default) or "text" for the value alone
#   "memory"    the physical memory in use; option style as for "cpu", and
#               option show, "percent" (default) or "used" for gigabytes
#   "battery"   the charge of the battery, with option style as for "cpu";
#               shows nothing on a machine without a battery
#   "network"   the connection Windows reaches the internet through: an icon
#               for a cable, Wi-Fi or a mobile network with its signal, and
#               the name of the network; option show, "name" (default) or
#               "icon" for the icon alone
#   "settings"  what this file holds, to change by clicking: the
#               arrangement, the language, the widgets and their options,
#               the pinned applications, tiling, the theme and the
#               extensions. It rewrites this file and keeps its comments;
#               made for a popup with place = "center"
#   "focused"   what the application window in front is called; absent
#               while there is none, as on the desktop; option show,
#               "title" (default) for the title of the window or
#               "program" for the name of its program file; option
#               width, the most it takes, in pixels
#   "media"     what is playing, on one line; absent while no application
#               offers anything; option width, the most it takes, in pixels
#   "media-controls"  what is playing, with its picture and buttons to skip and pause
#               and to shuffle and repeat where the player lets them;
#               while several applications play, a chip for each chooses
#               the one shown
#   "wifi"      the Wi-Fi networks in reach, for a popup; a click joins
#               one Windows has the settings of or anyone may join, and
#               asks for the password of another; two right clicks on a
#               saved one forget it
#   "problems"  how many things went wrong since Tessera started; shows
#               nothing while there are none, and opens the list of them
#   "problem-list"  what went wrong, the latest first, with a button that
#               forgets it all; for a popup
#   "bluetooth" the paired Bluetooth devices, for a popup: which are
#               connected, and the charge of those that report one
#   "connections"  what the machine is connected through, for a popup:
#               each connection with its address and speed, the VPN
#               connections Windows keeps, which a click connects and
#               disconnects, and the way to the network settings
#   "radio-switch"  a switch for a radio of the machine; option radio,
#               "wifi" or "bluetooth". Nothing on a machine without it
#   "bluetooth-button"  the Bluetooth icon, shown only on a machine that
#               has Bluetooth
#   "volume"    the output volume, as an icon and a percentage
#   "workspaces"  a numbered button for each virtual desktop of Windows,
#               or for each workspace of [workspaces], the shown one
#               standing out; a click goes there
#   "overview"  a card for each workspace of [workspaces] with the icons
#               of its windows, for a popup; a click on a card goes to
#               that workspace, a click on an icon to that window, and
#               an icon dragged onto another card moves its window there
#   "keyboard"  the language the window in front is typed in, as two
#               letters; a click asks that window for the next language
#   "volume-slider"  a mute button and a slider for the output volume
#   "microphone-slider"  the same for the default microphone
#   "volume-mixer"  a mute button and a slider for each program that
#               plays through the default output
#   "audio-outputs"  the audio outputs; a click on one makes it the
#               default
#               Option volumes, true for a slider under each output
#   "audio-inputs"  the microphones; a click on one makes it the default.
#               Each has a mute button and a slider for its own volume;
#               option volumes, false to leave them out
#   "spatial-sound"  whether the default output renders spatial sound;
#               nothing where it cannot. Windows lets no program choose
#               the format, so a click opens the sound settings
#   "sound-settings"  a row that opens the sound settings of Windows
#   "brightness"  how bright the display of the surface is, as an icon and
#               a percentage; nothing on a display that does not say
#   "brightness-slider"  a slider for the brightness of the display it is
#               shown on
#   "tray"      the notification icons of applications; option tips, true
#               or false: whether the description of the icon under the
#               pointer comes out of the bar under it. Without the option
#               it does.
#               Option limit, a number: only that many icons are shown,
#               and a button unrolls the strip to the others.
#               Option bluetooth, true or false: whether the Bluetooth icon
#               of Windows is among them. Without the option it is not: the
#               widgets below show Bluetooth
#               An application that draws the description of its icon
#               itself gets no description from the bar; it is told when
#               the pointer comes onto its icon instead
#   "windows"   a button for each application with windows on the display,
#               which a click goes through and a click with the middle
#               button starts once more; option pinned,
#               applications that keep a button whether they run or not:
#               paths of programs or shortcuts, names the Start menu gives
#               applications, or "shell:AppsFolder/" and the identifier of
#               a packaged (Store) application, such as
#               ["C:/Windows/notepad.exe", "Paint"]; option start, the
#               name of a popup: a button before the applications, drawn
#               like theirs, opens it, the way a Start button does; option
#               start-icon, the character it shows in place of the
#               mark of Tessera; option badges, true
#               or false: whether a button counts the notifications of
#               its application that wait in the notification center
#               (it does without the option). An application is told by
#               the identifier it posts under, or by the name of its
#               program file where Windows made that identifier up
#   "tiling"    whether and how windows are tiled; a click goes on to the
#               next layout, and after the last one to no tiling
#   "appearance" a sun while Windows is light and a moon while it is
#               dark, read every three seconds; a click makes Windows
#               and its applications the other, as the page Colors of
#               the settings does
#   "desktop"   a click shows the desktop by putting all windows aside,
#               and the next one brings them back; it asks the taskbar
#               of Windows, which stays hidden
#   "plan"      the power plan of Windows that is in use, read every five
#               seconds; a click opens the popup "plan", which lists the
#               plans. Option name, false to show the icon alone; option
#               cycle, true to have a click put the next plan in use, the
#               first after the last, instead (with popup = "")
#   "plan-list" every power plan of Windows, the one in use lit; a click
#               on another puts it in use. The popup "plan" holds it
#   "hdr"       whether the display of its bar shows high dynamic range,
#               asked every five seconds; a click switches it. Nothing
#               on a display that is not capable of it
#   "trash"     the number of items in the Recycle Bin, counted every
#               three seconds, or the icon alone while the bin is empty;
#               a click has Explorer open the bin. A right click opens
#               a menu: open it, bring every item back, or empty it
#               (Windows asks first)
#   "update"    nothing until github.com lists a release of Tessera newer
#               than the one running, then its name; a click opens its
#               page in the browser, or with install = true downloads
#               tessera.exe of that release, checks it against the
#               tessera.exe.sha256 beside it, puts it in the place of
#               the running program and starts it (not tried yet).
#               It asks 20 seconds after the start and then every hours
#               (24, at least 1); previews = true counts releases that
#               are previews; repository names another place than
#               https://github.com/redstone-md/tessera
#   "quit"      closes Tessera
#   "user"      the picture of the account that is signed in, or the first
#               letter of its name where it has none, and its name; option
#               name, false to show the picture alone. A click opens a popup
#               of "profile", "places" and "power" unless popup names
#               another
#   "profile"   that picture, larger, with the full name and the name of the
#               account, for a popup
#   "places"    the folders of the account, for a popup; a click opens one.
#               Option show, which of "home", "desktop", "documents",
#               "downloads", "pictures", "music" and "videos" to list, in
#               that order (all but the first two)
#   "label"     fixed content; options text and icon, a character of the
#               Segoe Fluent Icons font such as "\uE71D", or "tessera"
#               for the mark of Tessera
#   "command"   the first line a program prints, run again and again without
#               a window; options command, the program and its arguments as
#               a list such as ["cmd", "/C", "echo hello"], interval, the
#               seconds between runs (default 10, at least 1), and icon as
#               for "label". The program is expected to print UTF-8 and to
#               finish within 10 seconds.
#   "launcher"  a search field over the applications of the Start menu;
#               options placeholder, the hint in the empty field, and
#               folders, the folders whose files and folders the search
#               finds by their names as well, once two letters are
#               written, such as folders = ["~/Documents", "D:/music"]; a
#               ~ at the start is the folder of the user. They are read
#               four levels deep when the launcher opens, without what is
#               hidden, and the first 20000 are kept. Once two letters
#               are written the search also finds pages of the Windows
#               settings by their names; settings = false leaves them out.
#               Until something is written the applications stand as
#               tiles in rows; view = "list" keeps them one under another
#               The runners answer what is typed as well: calculations,
#               conversions of units and currencies, commands and paths
#               (> runs in a terminal), web searches (g:, ddg:, wiki:,
#               gh:, yt:, maps:), open windows, kill <name>, locking and
#               shutting down, pages of the settings and tools of
#               Windows, emoji (:name) and recent documents; what they are
#               sure of stands above the applications. Options runners,
#               the names of those to ask ("calculator", "units",
#               "command", "web", "search", "windows", "processes",
#               "power", "settings", "emoji", "recent"; all without it),
#               web, a table of more keywords as { so =
#               "https://stackoverflow.com/search?q={}" }, engine, the
#               keyword the last row searches the web with ("ddg"),
#               currency = false, which never fetches exchange rates from
#               the European Central Bank, and recent = true, the documents
#               opened lately while nothing is typed, in the list view
#   "runner"    the launcher as a single field, rows only once something is
#               typed and the recent documents before; the options of
#               "launcher", recent being true. It fills the popup "runner",
#               which stands near the top of the display (place = "top")
#   "run"       the Run dialog: runs a program, a folder, a document or an
#               address, with the history of the Run dialog of Explorer;
#               it fills the popup "run"
#   "apps"      the applications pinned to the Start menu, as a grid; options
#               pinned, their names as the search shows them, and columns,
#               how many stand in a row (5). The search pins and unpins
#               with the button of a row, a right click on a pinned one
#               unpins it; both rewrite this file
#   "power"     buttons that lock the session, put the computer to sleep, sign
#               out, restart and shut down; all but locking ask for a second
#               click. Option actions, which of "lock", "sleep", "sign-out",
#               "restart" and "shut-down" to offer, in that order;
#               "hibernate" is offered only when named here
#               Option updates = false leaves out "update-restart" and
#               "update-shut-down", which otherwise stand before restart
#               and shut down while updates of Windows wait for a restart,
#               and install them on the way; "switch-user", which shows
#               the screen to sign in on and keeps the session, is offered
#               when named, and acts at the first click as locking does
#   "power-dialog"  what the computer is to do, as a list chosen from with
#               the arrows, a letter or the pointer, and done with OK or
#               Enter; for the popup power-dialog in the middle of the
#               display, which the action power-dialog opens
#   "display-mode"  the four ways of Win+P to show the desktop on the
#               displays, the one in use checked and those that need
#               another display dimmed, and the way to a wireless display;
#               for the popup display-mode
#   "keyboard-list"  the keyboard layouts with the names Windows gives
#               them, the one of the window in front checked; a choice asks
#               that window for it. For the popup keyboard-list
#   "winx-menu" the menu of Win+X, for the popup winx
#   "winx"      a button that opens the menu of Win+X under it
#   "marketplace"  the extensions the registries offer, to install, update
#               and remove; contacts the registries when it is shown. Fills
#               the height left in its popup and scrolls. Option show,
#               "extensions" (default) or "themes" for the themes they
#               offer; option columns, 1 (default) to 4
#
# Widgets of the quick settings:
#   "tiles"     tiles in a grid, as the quick settings of Windows 11 show
#               them: option tiles, the widgets to show as tiles, each its
#               name or a table; option columns, how many stand in a row (2,
#               at most 4). A tile with details has a narrow button beside it
#               that unfolds them under its row: those that go with it, or
#               the widget its option detail names (a name or a table; ""
#               for none)
#   "radio-tile"  a tile that switches Wi-Fi or Bluetooth (option radio,
#               "wifi" or "bluetooth"); it unfolds "wifi" or "bluetooth"
#   "airplane"  a tile that switches every radio off, and back on those
#               that were on; lit while every radio is off. The airplane
#               mode of Windows itself is not set. It unfolds "radios"
#   "radios"    every radio of the machine with a switch of its own
#   "hotspot"   a tile that starts and stops the mobile hotspot, which
#               shares the internet connection over Wi-Fi; it unfolds
#               "hotspot-details"
#   "hotspot-details"  the name of the network of the hotspot, its
#               password (shown on a click), the devices on it, the band
#               to send it on and a QR code a phone joins it with, which
#               holds the password and so is drawn only while the password
#               is shown; option qr, false to leave the code out. The name
#               and the password are changed in the Windows settings it
#               leads to
#   "power-mode"  a tile with the power mode of Windows (best power
#               efficiency, balanced, best performance); a click puts the
#               next in use. Windows offers them only with the Balanced
#               plan. It unfolds "power-modes", the three to choose from
#   "night-light"  a tile that switches night light, that of Windows or
#               Tessera's own as [night_light] says; it unfolds
#               "night-light-slider", how warm the light is and when it
#               comes on
#   "devices"   a USB icon, there only while a drive or a device can be
#               taken out of the machine; a click opens the popup
#               "devices"
#   "devices-list"  the drives and devices to take out, for a popup: each
#               drive with how much of it is free and buttons that open it
#               and eject it, each other device with a button that ejects
#               it, and why Windows refused where it did
#   "privacy"   an icon for the microphone, the camera and the location
#               while an application uses it, with a tip naming the
#               applications; there only while one is in use. A click
#               opens the popup "privacy"
#   "privacy-list"  the applications that use each of them now, for a
#               popup, with a button to that page of the Windows settings

[[surface]]
edge = "top"
thickness = 48
start = ["workspaces", "cpu", "memory", "battery"]
center = [{ widget = "clock", popup = "calendar" }]
end = ["problems", { widget = "media", popup = "media" }, "privacy", "devices", "tray", { widget = "bluetooth-button", popup = "bluetooth" }, { widget = "network", popup = "network" }, { widget = "volume", popup = "sound" }, { widget = "label", icon = "", popup = "settings" }]

[[surface]]
edge = "bottom"
thickness = 76
center = [{ widget = "windows", start = "launcher" }]

# Each [[popup]] is a floating panel that opens next to the surface.
#   name           what widgets refer to
#   width, height  size in logical pixels
#   side           widgets in a second column to the right of content; the
#                  two columns share the width evenly
#   place          "surface" (default): at the widget that opened it;
#                  "center": in the middle of the display, the rest dimmed
#                  "top": near the top of the display, in the middle of its
#                  width, the rest not dimmed
#   content        widgets, stacked from the top
#
# Modules bring popups of their own: winx (300 by 660), power-dialog (in the
# middle, 400 by 600), display-mode (320 by 336) and keyboard-list (340 by
# 360), each holding the widget of the same name (winx-menu for winx), and
# quick-settings (360 by 420: connections, the radio-switch of wifi and of
# bluetooth, volume-slider and brightness-slider). A
# [[popup]] of the same name here is used instead.

[[popup]]
name = "launcher"
width = 640
height = 720
content = ["apps", "launcher", "power"]

[[popup]]
name = "calendar"
width = 620
height = 400
content = ["calendar"]
side = ["notifications"]

[[popup]]
name = "settings"
place = "center"
width = 1000
height = 700
content = ["settings"]

[[popup]]
name = "media"
width = 320
height = 164
content = ["media-controls"]

[[popup]]
name = "network"
width = 360
height = 600
content = ["connections", { widget = "radio-switch", radio = "wifi" }, "wifi"]

[[popup]]
name = "bluetooth"
width = 360
height = 380
content = [{ widget = "radio-switch", radio = "bluetooth" }, "bluetooth"]

[[popup]]
name = "sound"
width = 360
height = 680
content = ["volume-slider", "microphone-slider", "audio-outputs", "audio-inputs", "spatial-sound", "volume-mixer", "sound-settings"]

# The quick settings, as Windows 11 has them, in place of the plainer popup
# of that name the keys of Windows bring: win+a opens it where those keys
# are bound, as can a [[key]] such as the one above, or a widget given
# popup = "quick-settings".
[[popup]]
name = "quick-settings"
width = 380
height = 720
content = [{ widget = "tiles", columns = 2, tiles = [{ widget = "radio-tile", radio = "wifi" }, { widget = "radio-tile", radio = "bluetooth" }, "airplane", "hotspot", "power-mode", "night-light"] }, "volume-slider", "brightness-slider"]

# [tiling] puts the windows of each display side by side in the space the
# bars leave. layout is "master" (one window on the left half, the others
# stacked on the right), "columns", "rows", "grid" or "monocle" (every
# window takes the whole space, one over the other, and the focus keys go
# through them: right and down to the next, left and up to the one before);
# gap is the distance
# between tiles in pixels. only and except list programs by the file name of
# their executable: the only ones whose windows are tiled, and the ones whose
# windows are left alone. except_titles lists pieces of titles: a window
# whose title has one of them in it, in letters of any case, is left alone
# as well, from the moment it has that title. except_classes does the same
# with pieces of the names of window classes, which tools such as Spy++
# show; "#32770" is the class of dialogs. Windows go back to where they
# were when tiling is switched off or Tessera quits. border = true has Windows draw the thin
# border of the tiled window in front in the primary color of the theme;
# the window gets its own border back when another comes in front, tiling
# is switched off or Tessera quits, but keeps the color if Tessera is
# terminated. Needs Windows 11.
#
# [tiling]
# enabled = true
# layout = "master"
# gap = 8
# border = true
# except = ["taskmgr.exe"]
# except_titles = ["Picture-in-picture"]
# except_classes = ["#32770"]

# [snap] snaps windows that are dragged to an edge of a display: the left
# or right edge gives that half, the part of an edge near a corner the
# quarter there, and the top edge the whole display; a translucent shape
# shows where the window goes before it is let go. A snapped window that is
# dragged away takes its size from before again once it is let go. With
# Shift held while dragging, the [[snap.zone]] entries of the display are
# the places instead. After a window took a half, or a zone of the snap
# layouts, the other windows are offered for the rest (assist).
#   enabled      whether dragging snaps; without it, only when Tessera is
#                the shell. While it is on, the snapping of Windows itself
#                is off until Tessera quits ("Snap windows" in the
#                settings of Windows stays as it is written).
#   edge         how near an edge the pointer is to be, in pixels (8)
#   corner       how near a corner along an edge for a quarter (96)
#   gap          room left around snapped windows, in pixels (0)
#   assist       whether the other windows are offered for the rest (true)
#   hover        whether the snap layouts open when the pointer rests on
#                the maximize button of a window (as enabled)
#   hover_delay  how long it rests there first, in milliseconds (450)
# [[snap.zone]] has rect = [x, y, width, height] in shares of the work area
# of a display, and display, counted from 1 from the left, for one display
# only. [[snap.layout]] entries, each with zones, a list of such rects,
# replace the six layouts of Windows in the snap layouts (win+z).
# The keys of snapping are the actions snap, snap-display, snap-layouts and
# window-menu of the [[key]] entries above. While Tessera snaps, Windows'
# own Win+arrows and Win+Z are off with its snapping: they work only where
# windows_keys = true (by default when Tessera is the shell) binds
# Tessera's, or a [[key]] with action = "snap" does.
#
# [snap]
# enabled = true
# gap = 4
#
# [[snap.zone]]
# rect = [0, 0, 0.3333, 1]
#
# [[snap.zone]]
# rect = [0.3333, 0, 0.6667, 1]
#
# [[snap.layout]]
# zones = [[0, 0, 0.7, 1], [0.7, 0, 0.3, 1]]

# Each [[rule]] names windows and says what is done to them when they are
# first seen; with apply = "always" it is done again whenever the window
# changes, as far as it differs. Windows that are open already when Tessera
# starts, or when the rules change, only get the rules that apply always.
# A rule names windows by one or more of:
#   exe    the file name of the program, as "notepad.exe"
#   app    the packaged application, by its AppUserModelID, as
#          "Microsoft.WindowsCalculator_8wekyb3d8bbwe!App"; the windows of
#          apps such as Settings and Calculator all have the exe
#          "ApplicationFrameHost.exe" and the class "ApplicationFrameWindow"
#   title  what the title bar says
#   class  the window class, which tools such as Spy++ show
# each a pattern in which * stands for any text and ? for one character,
# whatever the case, or a regular expression after "re:". Every rule that
# names a window applies, in the order of the file, a later one having the
# last word. What a rule can do:
#   float = true   leave the window out of the tiles
#   tile = true    tile the window whatever [tiling] says of its program
#   workspace      the workspace of Tessera's own it goes to, from 1
#   display        the display it goes to, from 1 from the left
#   position       "center", or [x, y] in shares of the work area
#   size           [width, height] in shares of the work area
#   maximize       true to maximize it, false to restore it
#   above          true to keep it above the other windows
#   opacity        0.1 to 1: how opaque it is drawn; some programs draw
#                  badly once they are see-through
#   border = false Windows draws no thin border around it (Windows 11)
#   skip_dock, skip_switcher  read by the dock and the window switcher;
#                  neither leaves windows out yet
# A window that is tiled is not placed, sized or maximized by a rule. A
# title that a program gives its window more than a second after showing it
# needs apply = "always".
#
# [[rule]]
# app = "Microsoft.WindowsCalculator_*"
# float = true
# above = true
# position = "center"
#
# [[rule]]
# title = "*Picture-in-picture*"
# above = true
# apply = "always"
#
# [[rule]]
# exe = "re:^(code|cursor)\.exe$"
# workspace = 2
# display = 2
# maximize = true

# Each [[corner]] is a corner or an edge of the displays that does
# something when the pointer rests there: at is "top-left", "top-right",
# "bottom-left", "bottom-right", "top", "bottom", "left" or "right";
# display, counted from 1 from the left, limits it to one display; delay is
# how long the pointer rests there first, in milliseconds (150). It does
# one of: action (with arg) as a [[key]] does, popup, or run. It is done
# once, and again after the pointer has gone some way off; nothing is done
# while a button of the pointer is held or the window in front fills the
# display. A corner beats an edge it lies on.
#
# [[corner]]
# at = "top-left"
# popup = "launcher"
#
# [[corner]]
# at = "bottom-right"
# action = "desktop"
# delay = 300
#
# [[corner]]
# at = "top-right"
# display = 2
# run = ["wt.exe"]

# [workspaces] makes the "workspaces" widget show workspaces of Tessera's
# own instead of the virtual desktops of Windows: own is how many, 2 to 9.
# Going to a workspace hides the windows of the one left; a click with the
# right button on a button of the widget sends the window in front there.
# only and except list programs by the file name of their executable: the
# only ones whose windows belong to a workspace, and the ones whose windows
# are seen on every workspace. keys names the keys that, held with a digit,
# go to the workspace of that number, and with Shift as well send the
# window in front there: alt, ctrl, shift and win, joined by +. No program
# gets those combinations while Tessera holds them. Every window is shown
# again when Tessera quits, and at its next start if it was terminated.
# names is what the buttons say instead of their numbers, the first for the
# first workspace; it names the virtual desktops of Windows as well when
# there is no own, and a workspace without a name keeps its number.
# per_display = true gives every display workspaces of its own: a bar shows
# and changes those of its display, the keys those of the display the
# window in front is on, and a window belongs to the display it is seen on.
#
# [workspaces]
# own = 3
# per_display = true
# keys = "alt"
# names = ["web", "code", "chat"]
# except = ["taskmgr.exe"]

# [notifications] with banners = true has Tessera show a notification that
# arrives as a banner, in a corner of the display the pointer is on, for
# seconds seconds (6, between 2 and 60); the pointer on the banners keeps
# them, a click on one opens its application and takes the notification out
# of the notification center, and the cross on it only puts it away.
#   corner      "top-right" (default), "top-left", "bottom-right" or
#               "bottom-left"
#   stack       how many banners are shown at once (4, between 1 and 8)
#   history     how many notifications that left the notification center
#               without being dismissed here are kept (200, at most 1000),
#               in notifications.toml of %LOCALAPPDATA%\tessera
#   quiet       true: do not disturb holds the banners back until it is
#               switched off; the moon button of the "notifications" widget,
#               the "focus" widget and the action quiet write it too
#   quiet_when  what keeps the user busy so that do not disturb holds by
#               itself: "fullscreen" (an application fills the display),
#               "game", "presenting" and "duplicating" (a display shows the
#               picture of another); all four without the key, none with []
#   schedule    the hours do not disturb holds each day: from and to as
#               "22:00", to may be on the next day; days, the days they
#               start on ("mon" ... "sun"), every day without them
# Tessera learns of a notification by reading the notification center every
# two seconds, so a banner may come that much late, and Windows shows a
# banner of its own as well unless its settings tell it not to. Windows does
# not tell what the buttons of a notification do, so a banner has none.
# Without the key banners are off beside Explorer and on while Tessera is the
# shell, where Windows draws no banners; banners = false switches them off
# there too.
#
# [notifications]
# banners = true
# quiet = false
# seconds = 6
# corner = "bottom-right"
# stack = 3
# history = 200
# quiet_when = ["fullscreen", "game", "presenting", "duplicating"]
# schedule = { from = "22:00", to = "07:00", days = ["mon", "tue", "wed", "thu", "fri"] }
#
# [[notification_rule]] says what is done with the notifications of one
# application, named in app by its name or the identifier it posts under,
# with * for any letters and ? for one; the first rule that names an
# application decides.
#   banners   false: no banners, but listed
#   show      false: not listed, kept, shown or counted at all; the
#             notifications stay in the notification center of Windows
#   priority  true: banners even while do not disturb holds
#   badge     false: the buttons of the dock do not count them
#
# [[notification_rule]]
# app = "Microsoft Teams*"
# priority = true
#
# [[notification_rule]]
# app = "*OneDrive*"
# banners = false
# badge = false

# [switcher] with previews = true has each tile of the window switcher (see
# switch of [[key]] above) show a picture of its window, which Windows
# draws and keeps up to date, with the icon and the title under it; the
# tiles are larger then, six in a row. A window Windows gives no picture
# of shows its icon.
#
# style, scope and minimized of [switcher] choose how the switcher looks
# and which windows it offers:
#   style      "tiles" (default), "thumbnails" for large pictures of the
#              windows, as large and as many in a row as the display gives
#              room for, "list" for a line of icon, title and program for
#              each window, or "icons" for a row of icons with the title
#              of the chosen window under it; previews is for "tiles"
#   scope      "workspace" (default) for the windows of the workspace that
#              is shown, "display" for those on the display the switcher
#              opens on, or "all" to add the windows of the other
#              workspaces of Tessera's own ([workspaces] own); choosing
#              one of those goes to its workspace
#   minimized  "keep" (default) leaves minimized windows where they were
#              used, "last" puts them after the others, "hide" leaves
#              them out
# While the switcher is open, typing narrows the windows to those whose
# title or program has what was typed (Backspace takes a letter back, Esc
# all of them), the wheel moves the choice, and Delete, Ctrl+W or a click
# with the middle button asks the chosen window, or the one clicked, to
# close. The arrows, Enter, Esc, Delete and Backspace reach no other
# program meanwhile; letters, Tab and Ctrl+W reach the window in front
# where Windows refuses to bring the switcher in front of it.
#
# [switcher]
# previews = true
# style = "thumbnails"
# scope = "display"
# minimized = "last"

# [flyout] with volume = true has Tessera show the volume of the default
# audio output for a moment whenever it changes, whoever changed it: a pill
# with a wavy line and the number, at the lower side of the display the
# pointer is on. Nothing is shown while a popup of Tessera is open. Tessera
# reads the volume four times a second for this, and Windows shows its own
# indicator as well when the volume keys are pressed.
#
# [flyout]
# volume = true
# brightness = true   the built-in panel of a laptop, whose keys change it
# microphone = true   the default microphone muted, or no longer
# locks = true        Caps Lock and Num Lock
# layout = true       the window in front switched to another keyboard layout
# place = "bottom"    or "top", "top-left", "top-right", "bottom-left",
#                     "bottom-right"
#
# In shell mode Windows shows no indicator of its own.

# [night_light] chooses which night light the "night-light" tile and action
# switch, and when Tessera's own comes on by itself.
#   source     "windows" for that of Windows, which Windows switches by the
#              schedule of its own settings; "tessera" for Tessera's own,
#              which tints the colors of every display (Windows may refuse
#              a warm tint unless the DWORD GdiIcmGammaRange = 256 is set
#              under HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ICM);
#              "auto" (default) for that of Windows, or Tessera's own when
#              Tessera is the shell or Windows keeps no state of it
#   kelvins    how warm Tessera's own is, 1200 (warmest) to 6500 (3400),
#              when Tessera starts; the warmth set on "night-light-slider"
#              is forgotten when Tessera quits
#   schedule   when Tessera's own comes on: "off" (default), "sun" from
#              sunset to sunrise at latitude and longitude (degrees, north
#              and east positive), or "hours" from from to to. A click on
#              the tile holds until the schedule next changes
#   from, to   times of day for "hours" ("21:00", "07:00")
#
# [night_light]
# source = "auto"
# kelvins = 3400
# schedule = "sun"
# latitude = 55.75
# longitude = 37.62

# [wallpaper] has Tessera draw pictures behind the icons of the desktop, on
# every display, each scaled to cover it. images lists picture files (.jpg,
# .png) and directories, whose pictures are taken in the order of their
# names; with several pictures, each stays interval seconds (600, at least
# 5) and fades into the next. fit is "cover" (the picture is scaled until
# it covers the display and cut where it sticks out, which is what happens
# without it), "contain" (all of the picture is seen and the rest of the
# display is black) or "stretch" (the picture takes the shape of the
# display); it is not for the video. The wallpaper of Windows is not
# changed and shows again when Tessera exits. Needs Windows 11 24H2 or
# later.
#
# fit can also be "center" (in its own size in the middle), "tile" (in its
# own size, repeated) or "span" (one picture over all displays together);
# "fill" and "fit", the names Windows has, mean "cover" and "contain".
# color ("#rrggbb") or gradient (two colors, top to bottom) fills what a
# picture leaves free, or is the wallpaper alone without pictures. Besides
# .jpg and .png, pictures may be .bmp, .gif, .tif, .webp, and .heic, .avif
# or .jxr where Windows has the codec. shuffle = true takes the pictures
# and videos in a random order. images_light and images_dark replace
# images while Windows is light or dark, or with dark_hours by the clock.
#
# source says where the wallpaper comes from: "files" (images and videos),
# "windows" (the wallpaper of Windows, which Tessera draws only where the
# desktop window does not), "daily" (a picture of the day, daily = "bing"
# or "wikimedia", fetched once a day and kept for a week) or "color".
# Without it, it follows from what is given, and without anything it is
# "windows". mirror = true makes the picture shown the wallpaper of
# Windows too, and puts the one before back as Tessera exits.
#
# video names a video file that plays there instead, again and again and
# without its sound; the formats are the ones Windows plays, such as .mp4.
# The pictures are then shown only where the video cannot be played. A
# video that windows hide on every display is held still.
# A video with which Tessera holds more than 200 MB of memory is left out:
# 1920x1080 with H.264 stayed under that where it was tried, 3840x2160
# did not.
#
# Each [[wallpaper.display]] gives one display pictures of its own in place
# of images: number says which, the displays being counted from the left
# (and from the top where two begin equally far left), the first being 1.
# A display whose entry has no images gets no wallpaper of Tessera and shows
# the one of Windows. An entry may have its own video, videos and fit.
# Each [[wallpaper.workspace]] does the same for a workspace (the first
# being 1) on whatever display shows it, before the entry of the display.
#
# [wallpaper]
# images = ["C:/Users/me/Pictures/Wallpapers"]
# interval = 600
# video = "C:/Users/me/Videos/wallpaper.mp4"
# videos = ["C:/Users/me/Videos/hill.mp4"]   # played after video, in turn
# pause_on_battery = true                     # videos stand still on battery
# fit = "span"
# color = "#202020"
# gradient = ["#1e3c72", "#2a5298"]
# shuffle = true
# images_dark = ["C:/Users/me/Pictures/Night"]
# dark_hours = ["19:00", "07:00"]
# source = "daily"
# daily = "bing"
# mirror = true
#
# [[wallpaper.display]]
# number = 2
# images = ["C:/Users/me/Pictures/second.jpg"]
#
# [[wallpaper.workspace]]
# number = 3
# images = ["C:/Users/me/Pictures/Focus"]
#
# The widget wallpaper, and the action wallpaper (arg "next" or
# "previous"), show the next or the previous picture at once.

# Each [[card]] is a panel of widgets that lies on the desktop, below every
# window. corner is top-left, top-right (the default), bottom-left,
# bottom-right or center; x and y are the distances of the panel from the two
# sides of that corner (24 each; in the center they shift it right and down);
# displays is "all" or "primary"; content lists widgets as a popup does.
# While the surfaces are arranged a card is dragged with the pointer, which
# writes corner, x and y here.
#
# [[card]]
# corner = "top-right"
# width = 260
# height = 150
# content = [{ widget = "clock", format = "%H:%M" }, "cpu", "memory"]

# [icons] replaces application icons. Each key is the file name of an
# executable, each value an image file (PNG, JPEG or ICO); a relative path is
# looked up in %APPDATA%\tessera.
#
# [icons]
# "notepad.exe" = "icons/notepad.png"

# [extension.<id>] holds the settings of the extension with that id; the
# extension decides which keys it understands.
#
# [extension.ai-limits]
# providers = ["claude", "codex"]
