# The layout Tessera uses when %APPDATA%\tessera\config.toml does not exist.
# Copy this file there to change it; Tessera applies it again whenever it is written.

# Name of a theme file, %APPDATA%\tessera\themes\<name>.toml. Optional.
# The name "accent" is no file: it derives the colors from the accent color
# of the Windows settings, dark or light as those settings say for the
# taskbar, and follows both when they change. A theme file may hold
#   seed = "#rrggbb"    a color to derive all colors from, or "accent"
#   scheme = "light"    "dark" (default), "light" or "system"
#   [colors]            single roles as "#rrggbb", applied last
# theme = "example"

# Colors that are read (text, icons, the accent, outlines) are made lighter
# or darker by as little as gives them the contrast WCAG 2.1 asks for at
# level AA to the surfaces of the theme: 4.5 to 1, outlines 3 to 1. Colors
# that already have it stay. `false` leaves a theme exactly as written.
# Where a theme leaves out the fields behind the widgets of a bar
# (`flat`), the bar looks at the desktop under it every few seconds, and
# a widget whose text does not have that contrast to the desktop there
# gets its field back.
# contrast = false

# The language of the settings, the marketplace, the calendar, the lists of
# notifications and problems and the names of days and months in the clock: "en" (default), "ru",
# or the name of a file of the `languages` directory next to this file without `.toml`.
# What the widgets of the bars say stays English.
# language = "ru"

# The registries the "marketplace" widget reads: https addresses or absolute
# paths of registry files. Without the key it is the registry of the Tessera
# repository; an empty list reads none.
# registries = ["https://example.org/registry.toml"]

# The [[popup]] the Windows key opens and closes when it is pressed by itself,
# instead of the Start menu of Windows. Combinations with the key stay as
# they are. Without the key in this file, the Windows key is left to Windows.
# windows_key = "launcher"

# Each [[key]] is a key combination Tessera answers wherever it is pressed.
# press names it: keys to hold among alt, ctrl, shift and win, then the key
# to press, joined by +; that key is a digit, a letter, f1 to f12, space,
# tab, enter, left, up, right or down. No program gets the combination while
# Tessera holds it, and one that Windows or another program holds already is
# reported and does nothing. Each [[key]] has one of:
#   popup   the [[popup]] to open, or to close when it is open
#   tiling  "next" for the tiling mode after the one in use, "off", or a
#           layout of [tiling]
#   run     a program to start and its arguments, a list
#   focus   "left", "right", "up" or "down": the window on that side of the
#           window in front comes in front, among the windows [tiling]
#           covers, tiled or not
#   move    one of those sides: the window in front trades tiles with the
#           window on that side of it on its display, while tiling is on
#   switch  "next" or "previous": the window switcher opens in the middle of
#           the display the pointer is on, with the windows of all displays,
#           the one used last first; each further press while the keys to
#           hold stay down goes one window on (or back), and letting them go
#           brings the chosen window in front. The arrow keys move the
#           choice as well, Enter takes it and Esc closes the switcher
#           with nothing brought in front. Windows gives alt+tab to
#           no program, so Tessera takes keys it is refused from the keyboard
#           itself, and the switcher of Windows no longer opens for them
#
# [[key]]
# press = "ctrl+alt+space"
# popup = "launcher"
#
# [[key]]
# press = "ctrl+alt+t"
# tiling = "next"
#
# [[key]]
# press = "ctrl+alt+enter"
# run = ["wt.exe"]
#
# [[key]]
# press = "alt+left"
# focus = "left"
#
# [[key]]
# press = "alt+shift+left"
# move = "left"
#
# [[key]]
# press = "alt+tab"
# switch = "next"
#
# [[key]]
# press = "alt+shift+tab"
# switch = "previous"

# Each [[surface]] is a strip docked to a screen edge.
#   edge       "top" or "bottom"
#   thickness  reserved screen space, in logical pixels
#   displays   "all" (default) or "primary"
#   hide       true to have the strip slide away while the pointer is
#              elsewhere and come back when the pointer reaches that edge
#              of the display; "overlap" to have it do so only while a
#              window lies where the strip would be. Either way it reserves
#              no screen space
#   start, center, end  widgets to place
#
# A widget is its name, or a table: { widget = "name", popup = "name", ... }.
#   popup   the [[popup]] a click on the widget opens; any widget can have one.
#           A widget of an extension may come with a popup of its own;
#           popup = "" switches that off
#   other keys are options of that widget
#
# Built-in widgets:
#   "clock"     date and time; option format, a strftime pattern
#   "calendar"  a month to page through; option week_start, "monday" or "sunday"
#   "notifications"  the notifications of the Windows notification center,
#               each with a button that dismisses it; fills the height left
#               in its popup and scrolls
#   "cpu"       how busy the processors are, as a wavy line and a percentage;
#               option style, "wave" (default) or "text" for the value alone
#   "memory"    the physical memory in use; option style as for "cpu", and
#               option show, "percent" (default) or "used" for gigabytes
#   "battery"   the charge of the battery, with option style as for "cpu";
#               shows nothing on a machine without a battery
#   "network"   the connection Windows reaches the internet through: an icon
#               for a cable, Wi-Fi or a mobile network with its signal, and
#               the name of the network; option show, "name" (default) or
#               "icon" for the icon alone
#   "settings"  what this file holds, to change by clicking: the
#               arrangement, the language, the widgets and their options,
#               the pinned applications, tiling, the theme and the
#               extensions. It rewrites this file and keeps its comments;
#               made for a popup with place = "center"
#   "focused"   what the application window in front is called; absent
#               while there is none, as on the desktop; option show,
#               "title" (default) for the title of the window or
#               "program" for the name of its program file; option
#               width, the most it takes, in pixels
#   "media"     what is playing, on one line; absent while no application
#               offers anything; option width, the most it takes, in pixels
#   "media-controls"  what is playing, with its picture and buttons to skip and pause
#   "wifi"      the Wi-Fi networks in reach, for a popup; a click joins
#               one Windows has the settings of
#   "problems"  how many things went wrong since Tessera started; shows
#               nothing while there are none, and opens the list of them
#   "problem-list"  what went wrong, the latest first, with a button that
#               forgets it all; for a popup
#   "bluetooth" the paired Bluetooth devices, for a popup: which are
#               connected, and the charge of those that report one
#   "connections"  what the machine is connected through, for a popup:
#               each connection with its address and speed, the VPN
#               connections Windows keeps, which a click connects and
#               disconnects, and the way to the network settings
#   "radio-switch"  a switch for a radio of the machine; option radio,
#               "wifi" or "bluetooth". Nothing on a machine without it
#   "bluetooth-button"  the Bluetooth icon, shown only on a machine that
#               has Bluetooth
#   "volume"    the output volume, as an icon and a percentage
#   "workspaces"  a numbered button for each virtual desktop of Windows,
#               or for each workspace of [workspaces], the shown one
#               standing out; a click goes there
#   "keyboard"  the language the window in front is typed in, as two
#               letters; a click asks that window for the next language
#   "volume-slider"  a mute button and a slider for the output volume
#   "microphone-slider"  the same for the default microphone
#   "volume-mixer"  a mute button and a slider for each program that
#               plays through the default output
#   "audio-outputs"  the audio outputs; a click on one makes it the
#               default
#   "brightness"  how bright the display of the surface is, as an icon and
#               a percentage; nothing on a display that does not say
#   "brightness-slider"  a slider for the brightness of the display it is
#               shown on
#   "tray"      the notification icons of applications; option tips, true
#               or false: whether the description of the icon under the
#               pointer comes out of the bar under it. Without the option
#               it does.
#               Option limit, a number: only that many icons are shown,
#               and a button unrolls the strip to the others.
#               Option bluetooth, true or false: whether the Bluetooth icon
#               of Windows is among them. Without the option it is not: the
#               widgets below show Bluetooth
#   "windows"   a button for each application with windows on the display,
#               which a click goes through and a click with the middle
#               button starts once more; option pinned,
#               applications that keep a button whether they run or not:
#               paths of programs or shortcuts, names the Start menu gives
#               applications, or "shell:AppsFolder/" and the identifier of
#               a packaged (Store) application, such as
#               ["C:/Windows/notepad.exe", "Paint"]; option start, the
#               name of a popup: a button before the applications, drawn
#               like theirs, opens it, the way a Start button does; option
#               start-icon, the character it shows
#   "tiling"    whether and how windows are tiled; a click goes on to the
#               next layout, and after the last one to no tiling
#   "quit"      closes Tessera
#   "user"      the picture of the account that is signed in, or the first
#               letter of its name where it has none, and its name; option
#               name, false to show the picture alone. A click opens a popup
#               of "profile", "places" and "power" unless popup names
#               another
#   "profile"   that picture, larger, with the full name and the name of the
#               account, for a popup
#   "places"    the folders of the account, for a popup; a click opens one.
#               Option show, which of "home", "desktop", "documents",
#               "downloads", "pictures", "music" and "videos" to list, in
#               that order (all but the first two)
#   "label"     fixed content; options text and icon, a character of the
#               Segoe Fluent Icons font such as "\uE71D"
#   "command"   the first line a program prints, run again and again without
#               a window; options command, the program and its arguments as
#               a list such as ["cmd", "/C", "echo hello"], interval, the
#               seconds between runs (default 10, at least 1), and icon as
#               for "label". The program is expected to print UTF-8 and to
#               finish within 10 seconds.
#   "launcher"  a search field over the applications of the Start menu;
#               option placeholder, the hint in the empty field
#   "apps"      the applications pinned to the Start menu, as a grid; options
#               pinned, their names as the search shows them, and columns,
#               how many stand in a row (5). The search pins and unpins
#               with the button of a row, a right click on a pinned one
#               unpins it; both rewrite this file
#   "power"     buttons that lock the session, put the computer to sleep, sign
#               out, restart and shut down; all but locking ask for a second
#               click. Option actions, which of "lock", "sleep", "sign-out",
#               "restart" and "shut-down" to offer, in that order;
#               "hibernate" is offered only when named here
#   "marketplace"  the extensions the registries offer, to install, update
#               and remove; contacts the registries when it is shown. Fills
#               the height left in its popup and scrolls. Option show,
#               "extensions" (default) or "themes" for the themes they
#               offer; option columns, 1 (default) to 4

[[surface]]
edge = "top"
thickness = 48
start = ["workspaces", "cpu", "memory", "battery"]
center = [{ widget = "clock", popup = "calendar" }]
end = ["problems", { widget = "media", popup = "media" }, "tray", { widget = "bluetooth-button", popup = "bluetooth" }, { widget = "network", popup = "network" }, { widget = "volume", popup = "sound" }, { widget = "label", icon = "", popup = "settings" }]

[[surface]]
edge = "bottom"
thickness = 76
center = [{ widget = "windows", start = "launcher" }]

# Each [[popup]] is a floating panel that opens next to the surface.
#   name           what widgets refer to
#   width, height  size in logical pixels
#   side           widgets in a second column to the right of content; the
#                  two columns share the width evenly
#   place          "surface" (default): at the widget that opened it;
#                  "center": in the middle of the display, the rest dimmed
#   content        widgets, stacked from the top

[[popup]]
name = "launcher"
width = 420
height = 640
content = ["apps", "launcher", "power"]

[[popup]]
name = "calendar"
width = 620
height = 400
content = ["calendar"]
side = ["notifications"]

[[popup]]
name = "settings"
place = "center"
width = 1000
height = 700
content = ["settings"]

[[popup]]
name = "media"
width = 320
height = 164
content = ["media-controls"]

[[popup]]
name = "network"
width = 360
height = 520
content = ["connections", { widget = "radio-switch", radio = "wifi" }, "wifi"]

[[popup]]
name = "bluetooth"
width = 360
height = 380
content = [{ widget = "radio-switch", radio = "bluetooth" }, "bluetooth"]

[[popup]]
name = "sound"
width = 360
height = 520
content = ["volume-slider", "microphone-slider", "brightness-slider", "audio-outputs", "volume-mixer"]

# [tiling] puts the windows of each display side by side in the space the
# bars leave. layout is "master" (one window on the left half, the others
# stacked on the right), "columns", "rows" or "grid"; gap is the distance
# between tiles in pixels. only and except list programs by the file name of
# their executable: the only ones whose windows are tiled, and the ones whose
# windows are left alone. Windows go back to where they were when tiling is
# switched off or Tessera quits.
#
# [tiling]
# enabled = true
# layout = "master"
# gap = 8
# except = ["taskmgr.exe"]

# [workspaces] makes the "workspaces" widget show workspaces of Tessera's
# own instead of the virtual desktops of Windows: own is how many, 2 to 9.
# Going to a workspace hides the windows of the one left; a click with the
# right button on a button of the widget sends the window in front there.
# only and except list programs by the file name of their executable: the
# only ones whose windows belong to a workspace, and the ones whose windows
# are seen on every workspace. keys names the keys that, held with a digit,
# go to the workspace of that number, and with Shift as well send the
# window in front there: alt, ctrl, shift and win, joined by +. No program
# gets those combinations while Tessera holds them. Every window is shown
# again when Tessera quits, and at its next start if it was terminated.
#
# [workspaces]
# own = 3
# keys = "alt"
# except = ["taskmgr.exe"]

# [notifications] has Tessera show a notification that arrives as a banner,
# in the upper right corner of the display the pointer is on, for seconds
# seconds (6, between 2 and 60); the pointer on the banners keeps them, a
# click on one puts it away, and the notification stays in the notification
# center either way. quiet = true holds the banners back: do not disturb.
# The button with the moon in the "notifications" widget writes quiet too.
# Tessera learns of a notification by reading the notification center every
# two seconds, so a banner may come that much late, and Windows shows a
# banner of its own as well unless its settings tell it not to.
#
# [notifications]
# banners = true
# quiet = false
# seconds = 6

# [wallpaper] has Tessera draw pictures behind the icons of the desktop, on
# every display, each scaled to cover it. images lists picture files (.jpg,
# .png) and directories, whose pictures are taken in the order of their
# names; with several pictures, each stays interval seconds (600, at least
# 5) and fades into the next. The wallpaper of Windows is not changed and
# shows again when Tessera exits. Needs Windows 11 24H2 or later.
#
# video names a video file that plays there instead, again and again and
# without its sound; the formats are the ones Windows plays, such as .mp4.
# The pictures are then shown only where the video cannot be played. A
# video that windows hide on every display is held still.
# A video with which Tessera holds more than 200 MB of memory is left out:
# 1920x1080 with H.264 stayed under that where it was tried, 3840x2160
# did not.
#
# Each [[wallpaper.display]] gives one display pictures of its own in place
# of images: number says which, the displays being counted from the left
# (and from the top where two begin equally far left), the first being 1.
# A display whose entry has no images gets no wallpaper of Tessera and shows
# the one of Windows. A video still plays on every display.
#
# [wallpaper]
# images = ["C:/Users/me/Pictures/Wallpapers"]
# interval = 600
# video = "C:/Users/me/Videos/wallpaper.mp4"
#
# [[wallpaper.display]]
# number = 2
# images = ["C:/Users/me/Pictures/second.jpg"]

# Each [[card]] is a panel of widgets that lies on the desktop, below every
# window. corner is top-left, top-right (the default), bottom-left,
# bottom-right or center; x and y are the distances of the panel from the two
# sides of that corner (24 each; in the center they shift it right and down);
# displays is "all" or "primary"; content lists widgets as a popup does.
# While the surfaces are arranged a card is dragged with the pointer, which
# writes corner, x and y here.
#
# [[card]]
# corner = "top-right"
# width = 260
# height = 150
# content = [{ widget = "clock", format = "%H:%M" }, "cpu", "memory"]

# [icons] replaces application icons. Each key is the file name of an
# executable, each value an image file (PNG, JPEG or ICO); a relative path is
# looked up in %APPDATA%\tessera.
#
# [icons]
# "notepad.exe" = "icons/notepad.png"

# [extension.<id>] holds the settings of the extension with that id; the
# extension decides which keys it understands.
#
# [extension.ai-limits]
# providers = ["claude", "codex"]
