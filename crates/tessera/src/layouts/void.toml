[[surface]]
edge = "top"
thickness = 36
start = [{ widget = "focused", show = "program" }, { widget = "cpu", style = "text" }, { widget = "memory", style = "text" }, { widget = "media", popup = "media" }]
center = ["workspaces", { widget = "clock", popup = "calendar" }]
end = ["problems", "tray", "keyboard", { widget = "bluetooth-button", popup = "bluetooth" }, { widget = "network", popup = "network" }, { widget = "volume", popup = "sound" }, { widget = "label", icon = "", popup = "settings" }]

[[surface]]
edge = "bottom"
thickness = 64
center = [{ widget = "windows", start = "launcher" }]

# Each [[popup]] is a floating panel that opens next to the surface.
#   name           what widgets refer to
#   width, height  size in logical pixels
#   side           widgets in a second column to the right of content; the
#                  two columns share the width evenly
#   place          "surface" (default): at the widget that opened it;
#                  "center": in the middle of the display, the rest dimmed
#   content        widgets, stacked from the top

[[popup]]
name = "launcher"
width = 420
height = 640
content = ["apps", "launcher", "power"]

[[popup]]
name = "calendar"
width = 620
height = 400
content = ["calendar"]
side = ["notifications"]

[[popup]]
name = "settings"
place = "center"
width = 1000
height = 700
content = ["settings"]

[[popup]]
name = "media"
width = 320
height = 164
content = ["media-controls"]

[[popup]]
name = "network"
width = 360
height = 520
content = ["connections", { widget = "radio-switch", radio = "wifi" }, "wifi"]

[[popup]]
name = "bluetooth"
width = 360
height = 380
content = [{ widget = "radio-switch", radio = "bluetooth" }, "bluetooth"]

[[popup]]
name = "sound"
width = 340
height = 136
content = ["volume-slider", "brightness-slider"]
