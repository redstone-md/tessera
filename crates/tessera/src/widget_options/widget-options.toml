# Options of the widgets declared by widget-options. Format: widget_options.rs
# ([[widget]] with a name, then [[widget.setting]] entries, each an
# OptionDecl whose key is the option). Plain labels are English texts of
# the RUSSIAN table in i18n.rs.
#
# Every option a built-in widget reads is declared here, with the default,
# the range and the words its code takes. The options of the dock's `sort`
# (dock-pins), of the workspaces widget and of every widget (`*`,
# theme-styles) are declared in the files of those packages. `web` of the
# launcher and the runner is a table of keywords and addresses, which no
# kind of setting writes; the Search page of the settings edits it.

# The clock and the calendar.

[[widget]]
name = "clock"

[[widget.setting]]
key = "format"
kind = "text"
label = "Format"
description = "The date and time as a strftime pattern, such as %H:%M."
default = "%a %-d %b  %H:%M"

[[widget.setting]]
key = "zones"
kind = "list"
label = "Time zones"
description = "Zones whose time the tip and the calendar give, by IANA name, Windows name or city."

[[widget]]
name = "calendar"

[[widget.setting]]
key = "week_start"
kind = "choice"
label = "Week starts on"
description = "The first day of each row."
default = "monday"
choices = [{ value = "monday", label = "Monday" }, { value = "sunday", label = "Sunday" }]

[[widget.setting]]
key = "week_numbers"
kind = "toggle"
label = "Week numbers"
description = "Puts the week of the year, counted as ISO 8601 does, before each row."
default = false

[[widget.setting]]
key = "calendars"
kind = "list"
label = "Calendars"
description = "iCalendar files by their path, and feeds by an https:// or webcal:// address."

