# Password managers: their windows are small and are brought up for a
# moment, so they float, and belong to the category "password-manager".

[[rule]]
any = [
    { exe = "1Password.exe" },
    { exe = "Bitwarden.exe" },
    { exe = "KeePass.exe" },
    { exe = "KeePassXC.exe" },
    { exe = "Dashlane*.exe" },
    { exe = "Enpass.exe" },
    { exe = "Proton Pass.exe" },
    { exe = "NordPass.exe" },
    { exe = "RoboForm*.exe" },
]
float = true
category = "password-manager"
