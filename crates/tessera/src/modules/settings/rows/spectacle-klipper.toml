# Rows of the settings filled by spectacle-klipper. Format: modules/settings/rows.rs
# (RowCard, and [[action]] titles). Plain labels are English texts of the
# RUSSIAN table in i18n.rs.

# [clipboard]: the history of the clipboard and what it keeps.

[[card]]
section = "Clipboard and screenshots"
title = "Clipboard history"
table = "clipboard"
search = ["Win+V", "Paste", "Pinned"]

[[card.row]]
key = "enabled"
kind = "toggle"
label = "Keep a history of the clipboard"
description = "What is copied is kept while Tessera runs; off forgets all but the pinned items. Win+V follows it at the next start."
default = true

[[card.row]]
key = "size"
kind = "number"
label = "Items kept"
description = "Besides the pinned ones."
min = 1
max = 200
step = 1
default = 25

[[card.row]]
key = "images"
kind = "toggle"
label = "Keep pictures"
description = "As PNG files in cache\\clipboard of the configuration directory, while they are in the history."
default = true

[[card.row]]
key = "formats"
kind = "toggle"
label = "Keep the formatting of texts"
description = "The HTML and RTF a program copies beside a text, up to a megabyte each, are kept with it, so that it is pasted again with its formatting."
default = false
