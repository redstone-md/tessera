# Rows of the settings filled by shortcuts-editor. Format: modules/settings/rows.rs
# (RowCard, and [[action]] titles). Plain labels are English texts of the
# RUSSIAN table in i18n.rs.

# The Shortcuts page: every action with its keys, which it edits.
[[card]]
section = "Keys"
title = "Shortcuts"
page = "shortcuts"

# The titles of the actions registered on main, and of those this
# package adds. Every other package writes the titles of its own new
# actions in its own rows file.

