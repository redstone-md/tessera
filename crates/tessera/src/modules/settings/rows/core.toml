# Rows of the settings filled by settings-core. Format: modules/settings/rows.rs
# (RowCard, and [[action]] titles). Plain labels are English texts of the
# RUSSIAN table in i18n.rs.

# General.

[[card]]
section = "General"
title = "Windows key"
search = ["Launcher"]

[[card.row]]
key = "windows_key"
kind = "choice"
label = "Opens the launcher"
choices = [{ value = "unset", label = "Off" }, { value = "launcher", label = "On" }]

[[card]]
section = "General"
title = "Contrast"

[[card.row]]
key = "contrast"
kind = "toggle"
label = "Keep text readable (WCAG 2.1 AA)"
default = true

# Notifications, and the flyouts that show a change for a moment.

[[card]]
section = "Notifications"
title = "Notifications"
table = "notifications"

[[card.row]]
key = "banners"
kind = "toggle"
label = "Banners"
optional = true

[[card.row]]
key = "quiet"
kind = "toggle"
label = "Do not disturb"
optional = true

[[card.row]]
key = "seconds"
kind = "number"
label = "Seconds shown"
min = 2
max = 30
step = 2
default = 6
optional = true
unset_label = "Default"

[[card]]
section = "Notifications"
title = "Notifications"
table = "flyout"

[[card.row]]
key = "volume"
kind = "toggle"
label = "Volume flyout"
optional = true

# The other places come from FlyoutPlace (modules/settings/dynamic.rs).
[[card.row]]
key = "place"
kind = "choice"
label = "Where flyouts appear"
choices = [{ value = "unset", label = "Bottom" }]

# The file manager.

[[card]]
section = "Files"
title = "File manager"
table = "files"

[[card.row]]
key = "own"
kind = "toggle"
label = "Open folders in Tessera"
default = true

[[card.row]]
key = "hidden"
kind = "toggle"
label = "Show hidden files"
optional = true

# Options of every widget of a name.

[[card]]
section = "Widgets"
title = "Clock"
widget = "clock"

[[card.row]]
key = "format"
kind = "choice"
label = "Format"
choices = [
    { value = "unset", label = "Default" },
    { value = "%H:%M", label = { en = "14:05" } },
    { value = "%-I:%M %p", label = { en = "2:05 PM" } },
    { value = "%H:%M  %d.%m.%Y", label = { en = "14:05  21.11.2026" } },
    { value = "%a, %-d %b  %H:%M", label = { en = "Sat, 21 Nov  14:05" } },
]

[[card]]
section = "Widgets"
title = "Calendar"
widget = "calendar"

[[card.row]]
key = "week_start"
kind = "choice"
label = "Week starts on"
choices = [{ value = "unset", label = "Monday" }, { value = "sunday", label = "Sunday" }]

[[card]]
section = "Widgets"
title = "Processor"
widget = "cpu"

[[card.row]]
key = "style"
kind = "choice"
label = "Style"
choices = [{ value = "unset", label = "Wave" }, { value = "text", label = "Text" }]

[[card]]
section = "Widgets"
title = "Memory"
widget = "memory"

[[card.row]]
key = "style"
kind = "choice"
label = "Style"
choices = [{ value = "unset", label = "Wave" }, { value = "text", label = "Text" }]

[[card.row]]
key = "show"
kind = "choice"
label = "Shows"
choices = [{ value = "unset", label = "Percent" }, { value = "used", label = "Gigabytes" }]

[[card]]
section = "Widgets"
title = "Battery"
widget = "battery"

[[card.row]]
key = "style"
kind = "choice"
label = "Style"
choices = [{ value = "unset", label = "Wave" }, { value = "text", label = "Text" }]

# The connection widget; the meter of the network is `network-meter`.
[[card]]
section = "Widgets"
title = "Network"
widget = "network"

[[card.row]]
key = "show"
kind = "choice"
label = "Shows"
choices = [{ value = "unset", label = "Name" }, { value = "icon", label = "Icon" }]

# The dock and the Start menu.

[[card]]
section = "Dock"
title = "Dock"
widget = "windows"

[[card.row]]
key = "all_displays"
kind = "toggle"
label = "Windows of every display"
optional = true

[[card]]
section = "Dock"
title = "Start menu"
widget = "apps"

[[card.row]]
key = "columns"
kind = "number"
label = "Columns"
min = 3
max = 8
step = 1
default = 6
optional = true
unset_label = "Default"

# The notification area.

[[card]]
section = "Tray"
title = "Tray"
widget = "tray"

[[card.row]]
key = "limit"
kind = "number"
label = "Icons shown"
min = 1
max = 30
step = 1
default = 6
optional = true
unset_label = "All"

[[card.row]]
key = "tips"
kind = "toggle"
label = "Descriptions under the pointer"
default = true

# Windows: the tiling and the window switcher.

[[card]]
section = "Windows"
title = "Tiling"
table = "tiling"

[[card.row]]
key = "enabled"
kind = "toggle"
label = "Tile windows"
optional = true

# The other layouts, and those of files, come from dynamic.rs.
[[card.row]]
key = "layout"
kind = "choice"
label = "Layout"
choices = [
    { value = "unset", label = "Master" },
    { value = "columns", label = "Columns" },
    { value = "rows", label = "Rows" },
    { value = "grid", label = "Grid" },
    { value = "monocle", label = "Monocle" },
]

[[card.row]]
key = "gap"
kind = "number"
label = "Gap"
min = 0
max = 48
step = 4
default = 0
optional = true
unset_label = "Default"

[[card.row]]
key = "border"
kind = "toggle"
label = "Border of the window in front"
optional = true

[[card]]
section = "Windows"
title = "Window switcher"
table = "switcher"

[[card.row]]
key = "previews"
kind = "toggle"
label = "Window previews"
optional = true

[[card.row]]
key = "style"
kind = "choice"
label = "Style"
choices = [
    { value = "unset", label = "Icon tiles" },
    { value = "thumbnails", label = "Large pictures" },
    { value = "list", label = "Compact list" },
    { value = "icons", label = "Row of icons" },
    { value = "cover", label = "Cover" },
    { value = "flip", label = "Flip" },
]

[[card.row]]
key = "scope"
kind = "choice"
label = "Which windows"
choices = [
    { value = "unset", label = "This workspace" },
    { value = "display", label = "This display" },
    { value = "all", label = "All workspaces" },
]

[[card.row]]
key = "minimized"
kind = "choice"
label = "Minimized windows"
choices = [
    { value = "unset", label = "In their place" },
    { value = "last", label = "After the others" },
    { value = "hide", label = "Left out" },
]

# Workspaces.

[[card]]
section = "Workspaces"
title = "Workspaces"
table = "workspaces"

[[card.row]]
key = "own"
kind = "number"
label = "Own workspaces"
min = 2
max = 9
step = 1
default = 2
optional = true
unset_label = "Off"

[[card.row]]
key = "keys"
kind = "choice"
label = "Keys with a digit"
choices = [
    { value = "unset", label = "Off" },
    { value = "alt", label = { en = "Alt" } },
    { value = "ctrl+alt", label = { en = "Ctrl+Alt" } },
    { value = "win+alt", label = { en = "Win+Alt" } },
]

# The popups of the wallpaper, the displays and the power, drawn as pages
# of their sections.

[[card]]
section = "Wallpaper"
title = "Wallpaper settings"
page = "wallpaper-settings"
search = ["Wallpaper"]

[[card]]
section = "Displays and power"
title = "Display settings"
page = "display-settings"
search = ["Displays"]

[[card]]
section = "Displays and power"
title = "Power settings"
page = "power-settings"

# Night light: which one the tile and the action switch, and when
# Tessera's own comes on (modules/night.rs).

[[card]]
section = "Displays and power"
title = "Night light"
table = "night_light"

[[card.row]]
key = "source"
kind = "choice"
label = "Which night light"
description = "The one the tile and the action switch: that of Windows, or Tessera's own, which tints every display."
default = "auto"
choices = [
    { value = "auto", label = "Automatic" },
    { value = "windows", label = "Windows" },
    { value = "tessera", label = "Tessera's own" },
]

[[card.row]]
key = "kelvins"
kind = "number"
label = "Warmth"
description = "How warm Tessera's own is when Tessera starts, in kelvins: 1200 is the warmest, 6500 no tint."
min = 1200
max = 6500
step = 100
default = 3400
unit = "K"

[[card.row]]
key = "schedule"
kind = "choice"
label = "Comes on"
description = "When Tessera's own comes on by itself; a click on the tile holds until the schedule next changes."
default = "off"
choices = [
    { value = "off", label = "Off" },
    { value = "sun", label = "From sunset to sunrise" },
    { value = "hours", label = "At set hours" },
]

[[card.row]]
key = "from"
kind = "time"
label = "From"
description = "When it comes on."
default = "21:00"
visible_if = { key = "schedule", equals = "hours" }

[[card.row]]
key = "to"
kind = "time"
label = "To"
description = "When it goes off."
default = "07:00"
visible_if = { key = "schedule", equals = "hours" }

[[card.row]]
key = "latitude"
kind = "number"
label = "Latitude"
description = "Of the place whose sunset and sunrise it follows, in degrees, north positive."
min = -90
max = 90
step = 0.01
optional = true
visible_if = { key = "schedule", equals = "sun" }

[[card.row]]
key = "longitude"
kind = "number"
label = "Longitude"
description = "Of the same place, in degrees, east positive."
min = -180
max = 180
step = 0.01
optional = true
visible_if = { key = "schedule", equals = "sun" }

# The other keys at the top of the file.

[[card]]
section = "General"
title = "Windows key"

[[card.row]]
key = "windows_keys"
kind = "toggle"
label = "Keys of Windows that Tessera answers"
description = "Win+D, Win+E and the other keys of Windows that features of Tessera bring, where no [[key]] uses them."
optional = true
unset_label = "Only as the shell"

[[card]]
section = "General"
title = "Marketplace"
search = ["Extensions", "Themes"]

[[card.row]]
key = "registries"
kind = "list"
label = "Registries"
description = "The addresses of the registries the marketplace offers from; the official one while the list is not set."
optional = true

[[card]]
section = "General"
title = "Pictures of programs"

[[card.row]]
key = "icons"
kind = "pairs"
label = "Pictures of programs"
description = "A picture file shown instead of the icon of a program, by the file name of its executable."

[[card]]
section = "Window rules"
title = "Bundled rules"

[[card.row]]
key = "rule_templates"
kind = "list"
label = "Bundled rules"
description = "Sets of window rules that come with Tessera, applied before your own."
optional = true
choices = [
    { value = "browsers" },
    { value = "games" },
    { value = "password-managers" },
    { value = "system-dialogs" },
    { value = "development" },
    { value = "adobe" },
    { value = "picture-in-picture" },
]

# The other flyouts.

[[card]]
section = "Notifications"
title = "Flyouts"
table = "flyout"

[[card.row]]
key = "brightness"
kind = "toggle"
label = "Brightness flyout"
description = "Shows a change of the brightness of the built-in display."
optional = true

[[card.row]]
key = "microphone"
kind = "toggle"
label = "Microphone flyout"
description = "Shows the microphone being muted, or no longer."
optional = true

[[card.row]]
key = "locks"
kind = "toggle"
label = "Caps Lock and Num Lock flyout"
description = "Shows Caps Lock and Num Lock being switched."
optional = true

[[card.row]]
key = "layout"
kind = "toggle"
label = "Keyboard layout flyout"
description = "Shows another keyboard layout for the window in front, and the layouts while Win+Space is held."
optional = true

[[card.row]]
key = "media"
kind = "toggle"
label = "Now playing flyout"
description = "Shows another piece being played, with its picture."
optional = true

[[card.row]]
key = "workspace"
kind = "toggle"
label = "Workspace flyout"
description = "Shows going to another workspace."
optional = true

[[card.row]]
key = "seconds"
kind = "number"
label = "Seconds a flyout stays"
description = "After the last change; 1.6 seconds while it is not set."
min = 1
max = 10
step = 1
default = 2
optional = true
unset_label = "Default"

[[card.row]]
key = "margin"
kind = "number"
label = "Distance from the edge"
description = "How far a flyout hangs from the sides of the display, in pixels; 24 while it is not set."
min = 0
max = 200
step = 4
default = 24
optional = true
unset_label = "Default"

# The notices Tessera gives in place of Explorer.

[[card]]
section = "Notifications"
title = "Notices"
table = "notices"

[[card.row]]
key = "drives"
kind = "toggle"
label = "Drives that are plugged in"
description = "Tells of a drive that is plugged in, with a way to open it."
optional = true
unset_label = "Only as the shell"

[[card.row]]
key = "battery"
kind = "toggle"
label = "Battery running low"
description = "Warns of a battery running low at the levels of the power plan."
optional = true
unset_label = "Only as the shell"

# The rest of the window switcher.

[[card]]
section = "Windows"
title = "Window switcher"
table = "switcher"

[[card.row]]
key = "show_desktop"
kind = "toggle"
label = "Show desktop entry"
description = "Adds an entry that shows the desktop after the windows."
optional = true

# The programs that start with the session.

[[card]]
section = "Session"
title = "Startup apps"
table = "startup"

[[card.row]]
key = "run"
kind = "toggle"
label = "Start the programs of the session"
description = "As the shell, Tessera starts the programs that start with the session, as Explorer does."
default = true

[[card.row]]
key = "delay"
kind = "number"
label = "Seconds after the bars open"
description = "How long after the bars opened they start."
min = 0
max = 120
step = 1
default = 2
unit = "s"

[[card.row]]
key = "active_setup"
kind = "toggle"
label = "Active Setup first"
description = "Runs the components of Active Setup before them, as Explorer does at a first sign-in."
default = true

[[card.row]]
key = "packaged"
kind = "toggle"
label = "Startup tasks of Store apps"
description = "Starts the startup tasks of packaged applications as well."
default = true

# The performance mode.

[[card]]
section = "Displays and power"
title = "Performance mode"
table = "performance"
search = ["Battery"]

[[card.row]]
key = "default"
kind = "choice"
label = "On mains power"
description = "How much the shell spends on looks, wherever no other line applies."
default = "off"
choices = [
    { value = "off", label = "Off" },
    { value = "minimal", label = "Minimal" },
    { value = "extreme", label = "Extreme" },
]

[[card.row]]
key = "on_battery"
kind = "choice"
label = "On battery"
choices = [
    { value = "unset", label = "As on mains power" },
    { value = "off", label = "Off" },
    { value = "minimal", label = "Minimal" },
    { value = "extreme", label = "Extreme" },
]

[[card.row]]
key = "on_energy_saver"
kind = "choice"
label = "With energy saver"
description = "While energy saver or battery saver is on, whatever the power source."
choices = [
    { value = "unset", label = "As for the power source" },
    { value = "off", label = "Off" },
    { value = "minimal", label = "Minimal" },
    { value = "extreme", label = "Extreme" },
]

# The meters of the system.

[[card]]
section = "Widgets"
title = "Meters"
table = "system"

[[card.row]]
key = "interval"
kind = "number"
label = "Seconds between readings"
description = "Of a meter that names no time of its own."
min = 1
max = 60
step = 1
default = 2
unit = "s"

# The keys of [wallpaper] the wallpaper settings do not set.

[[card]]
section = "Wallpaper"
title = "Gradient and dark hours"
table = "wallpaper"

[[card.row]]
key = "gradient"
kind = "list"
label = "Gradient"
description = "Two colors, #rrggbb, from the top to the bottom, in place of the color."
min = 2
max = 2
optional = true

[[card.row]]
key = "dark_hours"
kind = "list"
label = "Dark hours"
description = "Two times of day, HH:MM, from when to when the pictures for dark Windows are shown; while Windows is dark without them."
min = 2
max = 2
optional = true
