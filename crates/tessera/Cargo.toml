[package]
name = "tessera"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
description = "Native desktop shell, recovery supervisor, and validation tools for Tessera"
publish = false
default-run = "tessera"

[dependencies]
tessera-core.workspace = true
tessera-windows.workspace = true
tessera-system.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[dev-dependencies]
tessera-ui.workspace = true

[target.'cfg(windows)'.dependencies]
tessera-ui.workspace = true
slint = { workspace = true, features = ["raw-window-handle-06", "renderer-femtovg"] }
raw-window-handle.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }

[build-dependencies]
winresource.workspace = true

[lints]
workspace = true
