name: CI

on:
  push:
    tags: ['v*']
    branches: ['diagnostics/native-media-seek', 'diagnostics/native-audio-admission']

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable
          - os: windows-latest
            toolchain: 1.92.0
    env:
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux native UI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends pkg-config libfontconfig1-dev
      - name: Install Rust tooling
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +${{ matrix.toolchain }} fmt --all --check
      - name: Run Clippy
        run: cargo +${{ matrix.toolchain }} clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo +${{ matrix.toolchain }} test --workspace --locked
      - name: Check API documentation
        run: cargo +${{ matrix.toolchain }} doc --workspace --no-deps --locked
      - name: Run layout demo
        run: cargo +${{ matrix.toolchain }} run -p tessera --locked -- demo
      - name: Inspect the Windows desktop without modifying it
        if: runner.os == 'Windows'
        run: cargo +${{ matrix.toolchain }} run -p tessera --locked -- inspect
      - name: Verify reversible deployment with isolated registry fixtures
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/tests/deployment.tests.ps1

  alpha:
    name: Package Windows test alpha
    needs: check
    if: startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-alpha.')
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the documented release toolchain
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: Build and verify portable unsigned test assets
        shell: pwsh
        run: ./scripts/package-alpha.ps1 -Tag $env:RELEASE_TAG
      - name: Publish test prerelease assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $directory = Join-Path 'target/alpha' $env:RELEASE_TAG.Substring(1)
          $assets = @(Get-ChildItem $directory -File | Where-Object { $_.Extension -eq '.zip' -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object FullName)
          if ($assets.Count -ne 3) { throw 'Expected portable ZIP, corresponding source ZIP, and checksums.' }
          gh release create $env:RELEASE_TAG @assets --verify-tag --prerelease --title "Tessera $env:RELEASE_TAG — test alpha" --notes-file docs/alpha-testing.md
          if ($LASTEXITCODE -ne 0) { throw 'Test alpha publication failed.' }
