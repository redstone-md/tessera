# Runs only for a tag that names a version, such as v0.3.0: checks the
# code, builds Tessera and publishes the files a release carries — the
# archive, and the program with its checksum, which the `update` widget
# installs. Nothing runs for ordinary pushes or pull requests.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Test and build every extension
        shell: bash
        run: |
          for manifest in extensions/*/Cargo.toml; do
            cargo test --manifest-path "$manifest" --locked
            cargo build --release --locked --target wasm32-unknown-unknown \
              --manifest-path "$manifest" --target-dir target/extensions
          done

  release:
    needs: [check, extensions]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Gather the files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/tessera | Out-Null
          Copy-Item target/release/tessera.exe, LICENSE, README.md dist/tessera/
          Copy-Item -Recurse themes, languages dist/tessera/
          New-Item -ItemType Directory -Force dist/tessera/wallpapers | Out-Null
          Copy-Item registry/wallpapers/*.jpg dist/tessera/wallpapers/
          Compress-Archive -Path dist/tessera -DestinationPath dist/tessera-win64.zip
          Copy-Item target/release/tessera.exe dist/tessera.exe
          $sum = (Get-FileHash dist/tessera.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -NoNewline -Path dist/tessera.exe.sha256 -Value "$sum  tessera.exe"
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          dist/tessera-win64.zip dist/tessera.exe dist/tessera.exe.sha256
          --title "Tessera ${{ github.ref_name }}" --generate-notes
          --verify-tag
