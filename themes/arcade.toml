# Tessera theme «Arcade»: Square pixels, red neon and teal: an evening at the arcade.
# Copy it to %APPDATA%\tessera\themes\ and choose it in the settings,
# install it from the marketplace, or write `theme = "arcade"` at the top
# of config.toml. Its wallpaper is registry/wallpapers/arcade.jpg.

seed = "#ff3b4f"
scheme = "dark"

# Every role is set, so the theme looks the same whatever it is derived from.
[colors]
surface_container = "#0d0f1c"
surface_container_highest = "#1a1d33"
on_surface = "#f2f4ff"
on_surface_variant = "#9aa0c8"
outline = "#444a80"
primary = "#ff3b4f"
secondary_container = "#0f4d52"

[shape]
small = 2
medium = 4
large = 6
full = 4

[spacing]
tiny = 4
small = 8
medium = 12

[typography]
family = "Consolas"
label_size = 13
icon_size = 15

[motion.spatial]
stiffness = 700
damping_ratio = 0.4

[motion.spatial_fast]
stiffness = 1400
damping_ratio = 0.4

[bar]
pill_height = 32

[dock]
container_height = 58
item_size = 46
icon_size = 30
indicator_height = 4
indicator_active_width = 20
