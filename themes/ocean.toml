# Tessera theme «Ocean»: Navy depths and aqua light from beneath the waves.
# Copy it to %APPDATA%\tessera\themes\ and choose it in the settings,
# install it from the marketplace, or write `theme = "ocean"` at the top
# of config.toml. Its wallpaper is registry/wallpapers/ocean.jpg.

seed = "#3fd0e8"
scheme = "dark"

# Every role is set, so the theme looks the same whatever it is derived from.
[colors]
surface_container = "#071a2b"
surface_container_highest = "#0e2a42"
on_surface = "#def3ff"
on_surface_variant = "#8fb3c9"
outline = "#2f5874"
primary = "#3fd0e8"
secondary_container = "#0f4566"

[shape]
small = 12
medium = 20
large = 30

[spacing]
tiny = 4
small = 9
medium = 15

[typography]
label_size = 14
icon_size = 16

[motion.spatial]
stiffness = 300
damping_ratio = 0.6

[motion.spatial_fast]
stiffness = 700
damping_ratio = 0.55

[bar]
pill_height = 36

[dock]
container_height = 64
item_size = 50
icon_size = 34
indicator_height = 4
indicator_active_width = 20

# What can be changed of the theme in Settings > Themes, where the theme is
# in use. config.toml keeps the values under [theme_options.ocean]; see
# docs/THEMES.md.

[[setting]]
key = "variant"
kind = "choice"
label = "Accent variant"
description = "Derives every color from another seed; the theme's own colors are replaced."
choices = [
    { value = "unset", label = { en = "Original", ru = "Исходный" } },
    { value = "teal", label = { en = "Teal", ru = "Бирюзовый" }, overlay = { seed = "#2fb3a8" } },
    { value = "indigo", label = { en = "Indigo", ru = "Индиго" }, overlay = { seed = "#6b7bff" } },
    { value = "coral", label = { en = "Coral", ru = "Коралловый" }, overlay = { seed = "#ff7a6b" } },
]

[[setting]]
key = "corners"
kind = "slider"
label = "Corner roundness"
description = "Multiplies the radii of the corners; fully round ones stay round."
min = 0
max = 2
step = 0.1
default = 1.0
unit = "×"
scale = ["shape.small", "shape.medium", "shape.large"]

[[setting]]
key = "density"
kind = "choice"
label = "Density"
choices = [
    { value = "unset", label = "Default" },
    { value = "compact", label = "Compact", overlay = { spacing = { tiny = 3, small = 7, medium = 12 }, bar = { pill_height = 32 } } },
    { value = "comfortable", label = "Comfortable", overlay = { spacing = { tiny = 5, small = 11, medium = 18 }, bar = { pill_height = 40 } } },
]

[[setting]]
key = "font"
kind = "font"
label = "Font"
optional = true
unset_label = "Default"
affects = ["typography.family"]

[[setting]]
key = "dock_size"
kind = "slider"
label = "Dock size"
description = "Multiplies the height of the dock, its buttons and their icons."
min = 0.6
max = 1.6
step = 0.05
default = 1.0
unit = "×"
scale = ["dock.container_height", "dock.item_size", "dock.icon_size"]
