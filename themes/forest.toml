# Tessera theme «Forest»: Deep moss greens and misty light from an old-growth wood.
# Copy it to %APPDATA%\tessera\themes\ and choose it in the settings,
# install it from the marketplace, or write `theme = "forest"` at the top
# of config.toml. Its wallpaper is registry/wallpapers/forest.jpg.

seed = "#8fd18b"
scheme = "dark"

# Every role is set, so the theme looks the same whatever it is derived from.
[colors]
surface_container = "#121a14"
surface_container_highest = "#1d2a20"
on_surface = "#e2efe3"
on_surface_variant = "#a3b8a5"
outline = "#4d6550"
primary = "#8fd18b"
secondary_container = "#2d4a2f"

[shape]
small = 10
medium = 18
large = 26

[spacing]
tiny = 4
small = 8
medium = 14

[typography]
label_size = 14
icon_size = 16

[motion.spatial]
stiffness = 340
damping_ratio = 0.75

[motion.spatial_fast]
stiffness = 800
damping_ratio = 0.75

[bar]
pill_height = 34

[dock]
container_height = 60
item_size = 46
icon_size = 30
indicator_height = 4
indicator_active_width = 20

# What can be changed of the theme in Settings > Themes, where the theme is
# in use. config.toml keeps the values under [theme_options.forest]; see
# docs/THEMES.md.

[[setting]]
key = "variant"
kind = "choice"
label = "Accent variant"
description = "Derives every color from another seed; the theme's own colors are replaced."
choices = [
    { value = "unset", label = { en = "Original", ru = "Исходный" } },
    { value = "moss", label = { en = "Moss", ru = "Мох" }, overlay = { seed = "#a3b86c" } },
    { value = "pine", label = { en = "Pine", ru = "Сосна" }, overlay = { seed = "#4fa37a" } },
    { value = "autumn", label = { en = "Autumn", ru = "Осень" }, overlay = { seed = "#d9a04f" } },
]

[[setting]]
key = "corners"
kind = "slider"
label = "Corner roundness"
description = "Multiplies the radii of the corners; fully round ones stay round."
min = 0
max = 2
step = 0.1
default = 1.0
unit = "×"
scale = ["shape.small", "shape.medium", "shape.large"]

[[setting]]
key = "density"
kind = "choice"
label = "Density"
choices = [
    { value = "unset", label = "Default" },
    { value = "compact", label = "Compact", overlay = { spacing = { tiny = 3, small = 7, medium = 12 }, bar = { pill_height = 32 } } },
    { value = "comfortable", label = "Comfortable", overlay = { spacing = { tiny = 5, small = 11, medium = 18 }, bar = { pill_height = 40 } } },
]

[[setting]]
key = "font"
kind = "font"
label = "Font"
optional = true
unset_label = "Default"
affects = ["typography.family"]

[[setting]]
key = "dock_size"
kind = "slider"
label = "Dock size"
description = "Multiplies the height of the dock, its buttons and their icons."
min = 0.6
max = 1.6
step = 0.05
default = 1.0
unit = "×"
scale = ["dock.container_height", "dock.item_size", "dock.icon_size"]
