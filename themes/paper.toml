# Tessera theme «Paper»: Ink on warm paper. Flat bars, square-ish shapes, no fuss.
# Copy it to %APPDATA%\tessera\themes\ and choose it in the settings,
# install it from the marketplace, or write `theme = "paper"` at the top
# of config.toml. Its wallpaper is registry/wallpapers/paper.jpg.

seed = "#8c4a2f"
scheme = "light"

# Every role is set, so the theme looks the same whatever it is derived from.
[colors]
surface_container = "#f6f0e4"
surface_container_highest = "#ebe2d1"
on_surface = "#2b2620"
on_surface_variant = "#6d6355"
outline = "#b9ab95"
primary = "#8c4a2f"
secondary_container = "#e3d5bb"

[shape]
small = 4
medium = 8
large = 12

[spacing]
tiny = 3
small = 7
medium = 12

[typography]
label_size = 13
icon_size = 15

[motion.spatial]
stiffness = 450
damping_ratio = 1.0

[motion.spatial_fast]
stiffness = 950
damping_ratio = 1.0

[bar]
pill_height = 28
flat = true

[dock]
container_height = 54
item_size = 42
icon_size = 28
indicator_height = 4
indicator_active_width = 16

# What can be changed of the theme in Settings > Themes, where the theme is
# in use. config.toml keeps the values under [theme_options.paper]; see
# docs/THEMES.md.

[[setting]]
key = "variant"
kind = "choice"
label = "Accent variant"
description = "Derives every color from another seed; the theme's own colors are replaced."
choices = [
    { value = "unset", label = { en = "Original", ru = "Исходный" } },
    { value = "ink", label = { en = "Ink blue", ru = "Чернила" }, overlay = { seed = "#2f4a8c" } },
    { value = "green", label = { en = "Green", ru = "Зелёный" }, overlay = { seed = "#3d6b3d" } },
    { value = "wine", label = { en = "Wine", ru = "Вино" }, overlay = { seed = "#7a2f4a" } },
]

[[setting]]
key = "corners"
kind = "slider"
label = "Corner roundness"
description = "Multiplies the radii of the corners; fully round ones stay round."
min = 0
max = 2
step = 0.1
default = 1.0
unit = "×"
scale = ["shape.small", "shape.medium", "shape.large"]

[[setting]]
key = "density"
kind = "choice"
label = "Density"
choices = [
    { value = "unset", label = "Default" },
    { value = "compact", label = "Compact", overlay = { spacing = { tiny = 3, small = 7, medium = 12 }, bar = { pill_height = 32 } } },
    { value = "comfortable", label = "Comfortable", overlay = { spacing = { tiny = 5, small = 11, medium = 18 }, bar = { pill_height = 40 } } },
]

[[setting]]
key = "font"
kind = "font"
label = "Font"
optional = true
unset_label = "Default"
affects = ["typography.family"]
