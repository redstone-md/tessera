# Spanish for Tessera. Copy this file into the `languages` directory of the
# configuration directory and choose the language in the settings, or set
# `language = "es"` in config.toml.
#
# A language file is named after what the configuration calls the language.
# `name` is what the language calls itself. The lists of months and of days
# of the week, Monday first, are each optional; `months-of` gives the months
# as they follow a day where they differ from `months`. [texts] gives the
# English texts of Tessera in the language; a text it lacks stays English.

name = "Español"
months = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"]
months-of = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"]
short-months = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"]
weekdays = ["lunes", "martes", "miércoles", "jueves", "viernes", "sábado", "domingo"]
short-weekdays = ["Lu", "Ma", "Mi", "Ju", "Vi", "Sá", "Do"]

