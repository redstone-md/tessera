# German for Tessera. Copy this file into the `languages` directory of the
# configuration directory and choose the language in the settings, or set
# `language = "de"` in config.toml.
#
# A language file is named after what the configuration calls the language.
# `name` is what the language calls itself. The lists of months and of days
# of the week, Monday first, are each optional; `months-of` gives the months
# as they follow a day where they differ from `months`. [texts] gives the
# English texts of Tessera in the language; a text it lacks stays English.

name = "Deutsch"
months = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"]
short-months = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"]
weekdays = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"]
short-weekdays = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"]

