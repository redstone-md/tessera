# Ukrainian for Tessera. Copy this file into the `languages` directory of the
# configuration directory and choose the language in the settings, or set
# `language = "uk"` in config.toml.
#
# A language file is named after what the configuration calls the language.
# `name` is what the language calls itself. The lists of months and of days
# of the week, Monday first, are each optional; `months-of` gives the months
# as they follow a day where they differ from `months`. [texts] gives the
# English texts of Tessera in the language; a text it lacks stays English.

name = "Українська"
months = ["Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень", "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"]
months-of = ["січня", "лютого", "березня", "квітня", "травня", "червня", "липня", "серпня", "вересня", "жовтня", "листопада", "грудня"]
short-months = ["січ", "лют", "бер", "кві", "тра", "чер", "лип", "сер", "вер", "жов", "лис", "гру"]
weekdays = ["понеділок", "вівторок", "середа", "четвер", "п'ятниця", "субота", "неділя"]
short-weekdays = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Нд"]

