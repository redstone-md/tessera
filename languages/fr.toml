# French for Tessera. Copy this file into the `languages` directory of the
# configuration directory and choose the language in the settings, or set
# `language = "fr"` in config.toml.
#
# A language file is named after what the configuration calls the language.
# `name` is what the language calls itself. The lists of months and of days
# of the week, Monday first, are each optional; `months-of` gives the months
# as they follow a day where they differ from `months`. [texts] gives the
# English texts of Tessera in the language; a text it lacks stays English.

name = "Français"
months = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"]
months-of = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"]
short-months = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."]
weekdays = ["lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche"]
short-weekdays = ["Lun.", "Mar.", "Mer.", "Jeu.", "Ven.", "Sam.", "Dim."]

