# Layouts refer to the widgets below as "exchange.rate" and
# "exchange.rates".
#
# Currency exchange rates from the open access of ExchangeRate-API
# (open.er-api.com), which asks for no account and updates its rates once
# a day. The currencies are given by their three-letter codes in the
# configuration of Tessera; these are the defaults:
#
#     [extension.exchange]
#     base = "USD"               # what the rates are counted in
#     symbols = "EUR, GBP, JPY"  # the bar shows the first
#     interval_minutes = 60      # 30 to 1440
#
# Only the base currency is sent, to open.er-api.com and to nobody else.
#
# The settings are changed in Settings > Extensions, which checks them
# against the declarations at the end of this file; writing them in
# config.toml as above does the same.
id = "exchange"

# What one unit of the base currency buys of the first currency, for a
# bar. A click on it opens the popup below, unless the layout names
# another popup for it.
[[widget]]
name = "rate"
refresh_seconds = 60
popup = "board"

# Every currency with its rate both ways, for a popup.
[[widget]]
name = "rates"
refresh_seconds = 60

[permissions]
network = ["open.er-api.com"]

# Layouts refer to this popup as "exchange.board".
[[popup]]
name = "board"
width = 300
height = 200
content = ["rates"]

# What can be set, for the settings to show and to check.

[[setting]]
key = "base"
kind = "text"
label = { en = "Base currency", ru = "Базовая валюта" }
placeholder = "USD"
max_length = 3
default = "USD"

[[setting]]
key = "symbols"
kind = "list"
label = { en = "Currencies", ru = "Валюты" }
description = { en = "Three-letter codes; the bar shows the first.", ru = "Трёхбуквенные коды; на панели первая." }
default = ["EUR", "GBP", "JPY"]

[[setting]]
key = "interval_minutes"
kind = "number"
label = { en = "Minutes between updates", ru = "Минут между обновлениями" }
min = 30
max = 1440
default = 60
unit = "min"
