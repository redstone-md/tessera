[package]
name = "tessera-example-pomodoro"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Tessera extension: a focus timer of work and breaks"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tessera-extension-kit = { path = "../kit" }

[profile.release]
opt-level = "s"
lto = true
strip = true

# Built for WebAssembly, separately from the shell.
[workspace]
