[package]
name = "tessera-example-device-battery"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Example Tessera extension: the charge of a Bluetooth device, for the bar"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63"

[profile.release]
opt-level = "s"
lto = true
strip = true

