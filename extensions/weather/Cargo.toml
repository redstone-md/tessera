[package]
name = "tessera-example-weather"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Example Tessera extension: the weather at a place the user names"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = "0.63"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Built for WebAssembly, separately from the shell.
[workspace]
