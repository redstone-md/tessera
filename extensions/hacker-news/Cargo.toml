[package]
name = "tessera-example-hacker-news"
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-only"
description = "Tessera extension: the top stories of Hacker News"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
tessera-extension-kit = { path = "../kit" }

[profile.release]
opt-level = "s"
lto = true
strip = true

# Built for WebAssembly, separately from the shell.
[workspace]
