[package]
name = "tessera-example-world-clock"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Tessera extension: the time in other places"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tessera-extension-kit = { path = "../kit" }

[profile.release]
opt-level = "s"
lto = true
strip = true

# Built for WebAssembly, separately from the shell.
[workspace]
