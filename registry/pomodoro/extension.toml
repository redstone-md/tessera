# Layouts refer to the widgets below as "pomodoro.timer" and
# "pomodoro.controls".
#
# A focus timer: a phase of work, then a break, and after some rounds of
# work a longer break. The lengths are set in the configuration of
# Tessera; these are the defaults:
#
#     [extension.pomodoro]
#     work_minutes = 25         # 1 to 180
#     break_minutes = 5         # 1 to 60
#     long_break_minutes = 15   # 1 to 120
#     rounds = 4                # rounds of work before a long break, 1 to 12
#     auto_start = true         # whether the next phase starts by itself
#     utc_offset = "+0"         # where "today" begins, as "+1" or "-5:30"
#
# The timer keeps when it was started rather than counting ticks, so it
# goes on while Tessera is closed. A phase that ended more than an hour
# before Tessera looked again is not counted, and the timer waits for
# Start. Nothing is sent anywhere.
#
# The settings are changed in Settings > Extensions, which checks them
# against the declarations at the end of this file; writing them in
# config.toml as above does the same.
id = "pomodoro"

# The phase and the time left in it, for a bar. A click on it opens the
# popup below, unless the layout names another popup for it.
[[widget]]
name = "timer"
refresh_seconds = 1
popup = "panel"

# The phase, the time left, buttons to start, pause, skip and reset, and
# the rounds of work done today, for a popup.
[[widget]]
name = "controls"
refresh_seconds = 1

# Layouts refer to this popup as "pomodoro.panel".
[[popup]]
name = "panel"
width = 300
height = 180
content = ["controls"]

# What can be set, for the settings to show and to check.

[[setting]]
key = "work_minutes"
kind = "number"
label = { en = "Minutes of work", ru = "Минут работы" }
min = 1
max = 180
default = 25
unit = "min"

[[setting]]
key = "break_minutes"
kind = "number"
label = { en = "Minutes of a break", ru = "Минут перерыва" }
min = 1
max = 60
default = 5
unit = "min"

[[setting]]
key = "long_break_minutes"
kind = "number"
label = { en = "Minutes of a long break", ru = "Минут длинного перерыва" }
min = 1
max = 120
default = 15
unit = "min"

[[setting]]
key = "rounds"
kind = "number"
label = { en = "Rounds before a long break", ru = "Раундов до длинного перерыва" }
min = 1
max = 12
default = 4

[[setting]]
key = "auto_start"
kind = "toggle"
label = { en = "Start the next phase by itself", ru = "Начинать следующую фазу самому" }
default = true

[[setting]]
key = "utc_offset"
kind = "text"
label = { en = "Offset from UTC", ru = "Смещение от UTC" }
description = { en = "Where your day begins, as +1 or -5:30; UTC where it is empty.", ru = "Где начинается ваш день, например +1 или -5:30; пусто означает UTC." }
placeholder = "+1, -5:30"
max_length = 9
