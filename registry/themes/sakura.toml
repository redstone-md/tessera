# Tessera theme «Sakura»: Soft blossom pinks on cream, light and round, with a gentle bounce.
# Copy it to %APPDATA%\tessera\themes\ and choose it in the settings,
# install it from the marketplace, or write `theme = "sakura"` at the top
# of config.toml. Its wallpaper is registry/wallpapers/sakura.jpg.

seed = "#d6457a"
scheme = "light"

# Every role is set, so the theme looks the same whatever it is derived from.
[colors]
surface_container = "#fff4f6"
surface_container_highest = "#fbe1e8"
on_surface = "#3a2330"
on_surface_variant = "#7d5a68"
outline = "#c79aab"
primary = "#d6457a"
secondary_container = "#ffd2e0"

[shape]
small = 14
medium = 24
large = 34

[spacing]
tiny = 5
small = 10
medium = 16

[typography]
label_size = 14
icon_size = 16

[motion.spatial]
stiffness = 280
damping_ratio = 0.5

[motion.spatial_fast]
stiffness = 650
damping_ratio = 0.5

[bar]
pill_height = 36

[dock]
container_height = 64
item_size = 50
icon_size = 34
indicator_height = 4
indicator_active_width = 20

# What can be changed of the theme in Settings > Themes, where the theme is
# in use. config.toml keeps the values under [theme_options.sakura]; see
# docs/THEMES.md.

[[setting]]
key = "variant"
kind = "choice"
label = "Accent variant"
description = "Derives every color from another seed; the theme's own colors are replaced."
choices = [
    { value = "unset", label = { en = "Original", ru = "Исходный" } },
    { value = "plum", label = { en = "Plum", ru = "Слива" }, overlay = { seed = "#9c4fd6" } },
    { value = "peach", label = { en = "Peach", ru = "Персик" }, overlay = { seed = "#e8806b" } },
    { value = "mint", label = { en = "Mint", ru = "Мята" }, overlay = { seed = "#4fb89a" } },
]

[[setting]]
key = "corners"
kind = "slider"
label = "Corner roundness"
description = "Multiplies the radii of the corners; fully round ones stay round."
min = 0
max = 2
step = 0.1
default = 1.0
unit = "×"
scale = ["shape.small", "shape.medium", "shape.large"]

[[setting]]
key = "density"
kind = "choice"
label = "Density"
choices = [
    { value = "unset", label = "Default" },
    { value = "compact", label = "Compact", overlay = { spacing = { tiny = 3, small = 7, medium = 12 }, bar = { pill_height = 32 } } },
    { value = "comfortable", label = "Comfortable", overlay = { spacing = { tiny = 5, small = 11, medium = 18 }, bar = { pill_height = 40 } } },
]

[[setting]]
key = "font"
kind = "font"
label = "Font"
optional = true
unset_label = "Default"
affects = ["typography.family"]

[[setting]]
key = "dock_size"
kind = "slider"
label = "Dock size"
description = "Multiplies the height of the dock, its buttons and their icons."
min = 0.6
max = 1.6
step = 0.05
default = 1.0
unit = "×"
scale = ["dock.container_height", "dock.item_size", "dock.icon_size"]
