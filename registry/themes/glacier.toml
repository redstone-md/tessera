# Tessera theme «Glacier»: Crisp ice blues on white; light, tidy and calm.
# Copy it to %APPDATA%\tessera\themes\ and choose it in the settings,
# install it from the marketplace, or write `theme = "glacier"` at the top
# of config.toml. Its wallpaper is registry/wallpapers/glacier.jpg.

seed = "#2b7fc4"
scheme = "light"

# Every role is set, so the theme looks the same whatever it is derived from.
[colors]
surface_container = "#f3f8fc"
surface_container_highest = "#dde9f3"
on_surface = "#10222f"
on_surface_variant = "#4f6677"
outline = "#9ab3c6"
primary = "#2b7fc4"
secondary_container = "#cfe5f7"

[shape]
small = 6
medium = 12
large = 18

[spacing]
tiny = 4
small = 7
medium = 12

[typography]
label_size = 13
icon_size = 15

[motion.spatial]
stiffness = 420
damping_ratio = 0.85

[motion.spatial_fast]
stiffness = 900
damping_ratio = 0.9

[bar]
pill_height = 30

[dock]
container_height = 56
item_size = 44
icon_size = 30
indicator_height = 4
indicator_active_width = 16

# What can be changed of the theme in Settings > Themes, where the theme is
# in use. config.toml keeps the values under [theme_options.glacier]; see
# docs/THEMES.md.

[[setting]]
key = "variant"
kind = "choice"
label = "Accent variant"
description = "Derives every color from another seed; the theme's own colors are replaced."
choices = [
    { value = "unset", label = { en = "Original", ru = "Исходный" } },
    { value = "arctic", label = { en = "Arctic", ru = "Арктика" }, overlay = { seed = "#4fb3d9" } },
    { value = "violet", label = { en = "Violet", ru = "Фиолетовый" }, overlay = { seed = "#7b6bd9" } },
    { value = "slate", label = { en = "Slate", ru = "Сланец" }, overlay = { seed = "#5f7d99" } },
]

[[setting]]
key = "corners"
kind = "slider"
label = "Corner roundness"
description = "Multiplies the radii of the corners; fully round ones stay round."
min = 0
max = 2
step = 0.1
default = 1.0
unit = "×"
scale = ["shape.small", "shape.medium", "shape.large"]

[[setting]]
key = "density"
kind = "choice"
label = "Density"
choices = [
    { value = "unset", label = "Default" },
    { value = "compact", label = "Compact", overlay = { spacing = { tiny = 3, small = 5, medium = 10 }, bar = { pill_height = 28 } } },
    { value = "comfortable", label = "Comfortable", overlay = { spacing = { tiny = 5, small = 11, medium = 18 }, bar = { pill_height = 40 } } },
]

[[setting]]
key = "font"
kind = "font"
label = "Font"
optional = true
unset_label = "Default"
affects = ["typography.family"]

[[setting]]
key = "dock_size"
kind = "slider"
label = "Dock size"
description = "Multiplies the height of the dock, its buttons and their icons."
min = 0.6
max = 1.6
step = 0.05
default = 1.0
unit = "×"
scale = ["dock.container_height", "dock.item_size", "dock.icon_size"]
