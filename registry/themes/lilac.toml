# Tessera theme «Lilac»: Lavender fields at golden hour, pastel and airy.
# Copy it to %APPDATA%\tessera\themes\ and choose it in the settings,
# install it from the marketplace, or write `theme = "lilac"` at the top
# of config.toml. Its wallpaper is registry/wallpapers/lilac.jpg.

seed = "#7b4fc9"
scheme = "light"

# Every role is set, so the theme looks the same whatever it is derived from.
[colors]
surface_container = "#f7f2fc"
surface_container_highest = "#ebe1f6"
on_surface = "#2a2136"
on_surface_variant = "#6c5d7d"
outline = "#b3a3c7"
primary = "#7b4fc9"
secondary_container = "#e3d3fa"

[shape]
small = 12
medium = 22
large = 30

[spacing]
tiny = 5
small = 9
medium = 15

[typography]
label_size = 14
icon_size = 16

[motion.spatial]
stiffness = 320
damping_ratio = 0.6

[motion.spatial_fast]
stiffness = 720
damping_ratio = 0.55

[bar]
pill_height = 34

[dock]
container_height = 62
item_size = 48
icon_size = 32
indicator_height = 4
indicator_active_width = 20

# What can be changed of the theme in Settings > Themes, where the theme is
# in use. config.toml keeps the values under [theme_options.lilac]; see
# docs/THEMES.md.

[[setting]]
key = "variant"
kind = "choice"
label = "Accent variant"
description = "Derives every color from another seed; the theme's own colors are replaced."
choices = [
    { value = "unset", label = { en = "Original", ru = "Исходный" } },
    { value = "rose", label = { en = "Rose", ru = "Роза" }, overlay = { seed = "#c94f9a" } },
    { value = "blue", label = { en = "Blue", ru = "Синий" }, overlay = { seed = "#4f6bc9" } },
    { value = "sage", label = { en = "Sage", ru = "Шалфей" }, overlay = { seed = "#6b9a7b" } },
]

[[setting]]
key = "corners"
kind = "slider"
label = "Corner roundness"
description = "Multiplies the radii of the corners; fully round ones stay round."
min = 0
max = 2
step = 0.1
default = 1.0
unit = "×"
scale = ["shape.small", "shape.medium", "shape.large"]

[[setting]]
key = "density"
kind = "choice"
label = "Density"
choices = [
    { value = "unset", label = "Default" },
    { value = "compact", label = "Compact", overlay = { spacing = { tiny = 3, small = 7, medium = 12 }, bar = { pill_height = 32 } } },
    { value = "comfortable", label = "Comfortable", overlay = { spacing = { tiny = 5, small = 11, medium = 18 }, bar = { pill_height = 40 } } },
]

[[setting]]
key = "font"
kind = "font"
label = "Font"
optional = true
unset_label = "Default"
affects = ["typography.family"]

[[setting]]
key = "dock_size"
kind = "slider"
label = "Dock size"
description = "Multiplies the height of the dock, its buttons and their icons."
min = 0.6
max = 1.6
step = 0.05
default = 1.0
unit = "×"
scale = ["dock.container_height", "dock.item_size", "dock.icon_size"]
