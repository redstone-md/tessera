# Tessera theme «Ember»: Warm charcoal with glowing orange, like coals after the fire.
# Copy it to %APPDATA%\tessera\themes\ and choose it in the settings,
# install it from the marketplace, or write `theme = "ember"` at the top
# of config.toml. Its wallpaper is registry/wallpapers/ember.jpg.

seed = "#ff7a2f"
scheme = "dark"

# Every role is set, so the theme looks the same whatever it is derived from.
[colors]
surface_container = "#1a1412"
surface_container_highest = "#2a201c"
on_surface = "#f6e7df"
on_surface_variant = "#c4a596"
outline = "#6e5246"
primary = "#ff7a2f"
secondary_container = "#5a2a12"

[shape]
small = 8
medium = 16
large = 24

[spacing]
tiny = 4
small = 8
medium = 14

[typography]
label_size = 14
icon_size = 16

[motion.spatial]
stiffness = 380
damping_ratio = 0.7

[motion.spatial_fast]
stiffness = 850
damping_ratio = 0.7

[bar]
pill_height = 34

[dock]
container_height = 60
item_size = 46
icon_size = 30
indicator_height = 4
indicator_active_width = 20

# What can be changed of the theme in Settings > Themes, where the theme is
# in use. config.toml keeps the values under [theme_options.ember]; see
# docs/THEMES.md.

[[setting]]
key = "variant"
kind = "choice"
label = "Accent variant"
description = "Derives every color from another seed; the theme's own colors are replaced."
choices = [
    { value = "unset", label = { en = "Original", ru = "Исходный" } },
    { value = "crimson", label = { en = "Crimson", ru = "Багровый" }, overlay = { seed = "#e8404f" } },
    { value = "gold", label = { en = "Gold", ru = "Золотой" }, overlay = { seed = "#f2b84b" } },
    { value = "copper", label = { en = "Copper", ru = "Медный" }, overlay = { seed = "#c2703d" } },
]

[[setting]]
key = "corners"
kind = "slider"
label = "Corner roundness"
description = "Multiplies the radii of the corners; fully round ones stay round."
min = 0
max = 2
step = 0.1
default = 1.0
unit = "×"
scale = ["shape.small", "shape.medium", "shape.large"]

[[setting]]
key = "density"
kind = "choice"
label = "Density"
choices = [
    { value = "unset", label = "Default" },
    { value = "compact", label = "Compact", overlay = { spacing = { tiny = 3, small = 7, medium = 12 }, bar = { pill_height = 32 } } },
    { value = "comfortable", label = "Comfortable", overlay = { spacing = { tiny = 5, small = 11, medium = 18 }, bar = { pill_height = 40 } } },
]

[[setting]]
key = "font"
kind = "font"
label = "Font"
optional = true
unset_label = "Default"
affects = ["typography.family"]

[[setting]]
key = "dock_size"
kind = "slider"
label = "Dock size"
description = "Multiplies the height of the dock, its buttons and their icons."
min = 0.6
max = 1.6
step = 0.05
default = 1.0
unit = "×"
scale = ["dock.container_height", "dock.item_size", "dock.icon_size"]
