# A Tessera theme: small, square and calm. Copy it to
# %APPDATA%\tessera\themes\ and choose it in the settings, or write
# `theme = "compact"` at the top of config.toml.

seed = "#8ab4f8"
scheme = "dark"

[shape]
small = 3
medium = 6
large = 10
full = 8

[spacing]
tiny = 3
small = 6
medium = 12

[typography]
family = "Segoe UI"
label_size = 13
icon_size = 15

# Nothing overshoots.
[motion.spatial]
stiffness = 600
damping_ratio = 1

[motion.spatial_fast]
stiffness = 1200
damping_ratio = 1

[bar]
pill_height = 32

[dock]
container_height = 54
item_size = 42
icon_size = 28
indicator_height = 3
indicator_active_width = 12

[meter]
width = 36
stroke = 2
amplitude = 1.5
wavelength = 10

# What can be changed of the theme in Settings > Themes, where the theme is
# in use. config.toml keeps the values under [theme_options.compact]; see
# docs/THEMES.md.

[[setting]]
key = "variant"
kind = "choice"
label = "Accent variant"
description = "Derives every color from another seed; the theme's own colors are replaced."
choices = [
    { value = "unset", label = { en = "Original", ru = "Исходный" } },
    { value = "green", label = { en = "Green", ru = "Зелёный" }, overlay = { seed = "#8fd18b" } },
    { value = "amber", label = { en = "Amber", ru = "Янтарный" }, overlay = { seed = "#f2b84b" } },
]

[[setting]]
key = "corners"
kind = "slider"
label = "Corner roundness"
description = "Multiplies the radii of the corners; fully round ones stay round."
min = 0
max = 2
step = 0.1
default = 1.0
unit = "×"
scale = ["shape.small", "shape.medium", "shape.large"]

[[setting]]
key = "font"
kind = "font"
label = "Font"
optional = true
unset_label = "Default"
affects = ["typography.family"]
