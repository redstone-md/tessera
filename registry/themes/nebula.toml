# Tessera theme «Nebula»: Magenta and indigo clouds of a distant nebula.
# Copy it to %APPDATA%\tessera\themes\ and choose it in the settings,
# install it from the marketplace, or write `theme = "nebula"` at the top
# of config.toml. Its wallpaper is registry/wallpapers/nebula.jpg.

seed = "#d16bff"
scheme = "dark"

# Every role is set, so the theme looks the same whatever it is derived from.
[colors]
surface_container = "#120c24"
surface_container_highest = "#1f1638"
on_surface = "#efe8ff"
on_surface_variant = "#ab9fd1"
outline = "#4d3f80"
primary = "#d16bff"
secondary_container = "#3a1f6e"

[shape]
small = 12
medium = 22
large = 30

[spacing]
tiny = 4
small = 9
medium = 15

[typography]
label_size = 14
icon_size = 16

[motion.spatial]
stiffness = 300
damping_ratio = 0.55

[motion.spatial_fast]
stiffness = 720
damping_ratio = 0.5

[bar]
pill_height = 36

[dock]
container_height = 64
item_size = 50
icon_size = 34
indicator_height = 4
indicator_active_width = 20

# What can be changed of the theme in Settings > Themes, where the theme is
# in use. config.toml keeps the values under [theme_options.nebula]; see
# docs/THEMES.md.

[[setting]]
key = "variant"
kind = "choice"
label = "Accent variant"
description = "Derives every color from another seed; the theme's own colors are replaced."
choices = [
    { value = "unset", label = { en = "Original", ru = "Исходный" } },
    { value = "cyan", label = { en = "Cyan", ru = "Голубой" }, overlay = { seed = "#4fd9ff" } },
    { value = "magenta", label = { en = "Magenta", ru = "Пурпурный" }, overlay = { seed = "#ff4fb8" } },
    { value = "gold", label = { en = "Gold", ru = "Золотой" }, overlay = { seed = "#ffc94f" } },
]

[[setting]]
key = "corners"
kind = "slider"
label = "Corner roundness"
description = "Multiplies the radii of the corners; fully round ones stay round."
min = 0
max = 2
step = 0.1
default = 1.0
unit = "×"
scale = ["shape.small", "shape.medium", "shape.large"]

[[setting]]
key = "font"
kind = "font"
label = "Font"
optional = true
unset_label = "Default"
affects = ["typography.family"]

[[setting]]
key = "dock_size"
kind = "slider"
label = "Dock size"
description = "Multiplies the height of the dock, its buttons and their icons."
min = 0.6
max = 1.6
step = 0.05
default = 1.0
unit = "×"
scale = ["dock.container_height", "dock.item_size", "dock.icon_size"]
