# Layouts refer to the widgets below as "world-clock.clock" and
# "world-clock.zones".
#
# The time in other places, set in the configuration of Tessera as names
# and offsets from UTC apart by `;`, half and quarter hours allowed:
#
#     [extension.world-clock]
#     zones = "Tokyo=+9; London=+0; New York=-5; Mumbai=+5:30"
#     utc_offset = "+1"   # your own offset, which "today" and "tomorrow"
#                         # in the popup are counted from; +0 when missing
#     hour12 = false      # true writes 9:05 pm instead of 21:05
#
# The offsets are fixed: daylight saving time is not applied, so a place
# that moves its clocks needs its offset changed when it does. Nothing is
# sent anywhere.
#
# The settings are changed in Settings > Extensions, which checks them
# against the declarations at the end of this file; writing them in
# config.toml as above does the same.
id = "world-clock"

# The time at the first place, for a bar. A click on it opens the popup
# below, unless the layout names another popup for it.
[[widget]]
name = "clock"
refresh_seconds = 10
popup = "places"

# The time and day at every place, for a popup.
[[widget]]
name = "zones"
refresh_seconds = 10

# Layouts refer to this popup as "world-clock.places".
[[popup]]
name = "places"
width = 300
height = 200
content = ["zones"]

# What can be set, for the settings to show and to check.

[[setting]]
key = "zones"
kind = "pairs"
label = { en = "Places", ru = "Места" }
description = { en = "Each a name and an offset from UTC, as Tokyo=+9 or Mumbai=+5:30. Daylight saving time is not applied.", ru = "Название и смещение от UTC, например Tokyo=+9 или Mumbai=+5:30. Летнее время не учитывается." }

[[setting]]
key = "utc_offset"
kind = "text"
label = { en = "Offset from UTC", ru = "Смещение от UTC" }
description = { en = "Where your day begins, as +1 or -5:30; UTC where it is empty.", ru = "Где начинается ваш день, например +1 или -5:30; пусто означает UTC." }
placeholder = "+1, -5:30"
max_length = 9

[[setting]]
key = "hour12"
kind = "toggle"
label = { en = "12-hour clock", ru = "12-часовой формат" }
default = false
