# Layouts refer to the widgets below as "air-quality.index" and
# "air-quality.details".
#
# The air quality at a place, from the air quality forecast of Open-Meteo,
# which asks for no account. The place is set in the configuration of
# Tessera in degrees, north and east counted positive:
#
#     [extension.air-quality]
#     latitude = 52.52
#     longitude = 13.41
#     interval_minutes = 30   # 10 to 1440
#
# It shows the European Air Quality Index, where up to 20 is good and
# above 100 extremely poor, with fine particles (PM2.5), coarser particles
# (PM10) and ozone. The place is sent to Open-Meteo, rounded to a
# hundredth of a degree, and to nobody else. Without it nothing is asked.
#
# The settings are changed in Settings > Extensions, which checks them
# against the declarations at the end of this file; writing them in
# config.toml as above does the same.
id = "air-quality"

[permissions]
network = ["air-quality-api.open-meteo.com"]

# The index and what it means, for a bar. A click on it opens the popup
# below, unless the layout names another popup for it.
[[widget]]
name = "index"
refresh_seconds = 60
popup = "air"

# The index with the particles and ozone behind it, for a popup.
[[widget]]
name = "details"
refresh_seconds = 60

# Layouts refer to this popup as "air-quality.air".
[[popup]]
name = "air"
width = 300
height = 200
content = ["details"]

# What can be set, for the settings to show and to check.

[[setting]]
key = "latitude"
kind = "number"
label = { en = "Latitude", ru = "Широта" }
description = { en = "Degrees north, negative to the south. Without it nothing is asked.", ru = "Градусы северной широты, к югу отрицательные. Без неё ничего не запрашивается." }
min = -90
max = 90
step = 0.01
unit = "°"
optional = true

[[setting]]
key = "longitude"
kind = "number"
label = { en = "Longitude", ru = "Долгота" }
description = { en = "Degrees east, negative to the west.", ru = "Градусы восточной долготы, к западу отрицательные." }
min = -180
max = 180
step = 0.01
unit = "°"
optional = true

[[setting]]
key = "interval_minutes"
kind = "number"
label = { en = "Minutes between updates", ru = "Минут между обновлениями" }
min = 10
max = 1440
default = 30
unit = "min"
