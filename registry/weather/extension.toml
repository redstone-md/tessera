# Layouts refer to the widgets below as "weather.now" and
# "weather.forecast".
#
# Where the weather is asked for is set in the configuration of Tessera,
# in degrees, north and east counted positive:
#
#     [extension.weather]
#     latitude = 52.52
#     longitude = 13.41
#     unit = "celsius"        # or "fahrenheit"
#     interval_minutes = 20   # at least 5
#
# The place is sent to Open-Meteo, rounded to a hundredth of a degree, and
# to nobody else. Without it nothing is asked.
#
# The settings are changed in Settings > Extensions, which checks them
# against the declarations at the end of this file; writing them in
# config.toml as above does the same.
id = "weather"

# The weather comes from Open-Meteo, which asks for no account.
[permissions]
network = ["api.open-meteo.com"]

# The temperature and the sky, for a bar. A click on it opens the popup
# below, unless the layout names another popup for it.
[[widget]]
name = "now"
refresh_seconds = 30
popup = "days"

# The weather now and on the next days, for a popup.
[[widget]]
name = "forecast"
refresh_seconds = 30

# Layouts refer to this popup as "weather.days".
[[popup]]
name = "days"
width = 320
height = 232
content = ["forecast"]

# What can be set, for the settings to show and to check.

[[setting]]
key = "latitude"
kind = "number"
label = { en = "Latitude", ru = "Широта" }
description = { en = "Degrees north, negative to the south. Without it nothing is asked.", ru = "Градусы северной широты, к югу отрицательные. Без неё ничего не запрашивается." }
min = -90
max = 90
step = 0.01
unit = "°"
optional = true

[[setting]]
key = "longitude"
kind = "number"
label = { en = "Longitude", ru = "Долгота" }
description = { en = "Degrees east, negative to the west.", ru = "Градусы восточной долготы, к западу отрицательные." }
min = -180
max = 180
step = 0.01
unit = "°"
optional = true

[[setting]]
key = "unit"
kind = "choice"
label = { en = "Unit", ru = "Единицы" }
default = "celsius"
choices = [{ value = "celsius", label = { en = "Celsius", ru = "Цельсий" } }, { value = "fahrenheit", label = { en = "Fahrenheit", ru = "Фаренгейт" } }]

[[setting]]
key = "interval_minutes"
kind = "number"
label = { en = "Minutes between updates", ru = "Минут между обновлениями" }
min = 5
max = 1440
default = 20
unit = "min"
