# Layouts refer to the widgets below as "ai-limits.summary" and
# "ai-limits.details".
#
# The settings are changed in Settings > Extensions, which checks them
# against the declarations at the end of this file; writing them in
# config.toml under [extension.ai-limits] does the same.
# The keys of OpenRouter and DeepSeek are not offered there and stay in
# config.toml, as `openrouter_key` and `deepseek_key`.
id = "ai-limits"

# One line for a bar: the tightest limit of each service.
[[widget]]
name = "summary"
refresh_seconds = 30

# Every limit with its plan and reset time, for a popup.
[[widget]]
name = "details"
refresh_seconds = 30

[permissions]
# The services asked for usage; nothing else can be contacted.
network = [
    "api.anthropic.com",
    "chatgpt.com",
    "openrouter.ai",
    "api.deepseek.com",
]
# The sign-ins of Claude Code and Codex, read to ask for the usage of the
# signed-in account. They are sent only to the service they belong to.
files = [
    "~/.claude/.credentials.json",
    "~/.codex/auth.json",
]

# What can be set, for the settings to show and to check.

[[setting]]
key = "providers"
kind = "list"
label = { en = "Services", ru = "Сервисы" }
description = { en = "Of claude, codex, openrouter and deepseek. The keys of OpenRouter and DeepSeek are written in config.toml only.", ru = "Из claude, codex, openrouter и deepseek. Ключи OpenRouter и DeepSeek пишутся только в config.toml." }
default = ["claude", "codex"]

[[setting]]
key = "summary"
kind = "list"
label = { en = "In the bar", ru = "На панели" }
description = { en = "The services the bar shows; all of the above where it is empty.", ru = "Сервисы на панели; пусто — все перечисленные выше." }
optional = true
affects = ["summary"]

[[setting]]
key = "interval_minutes"
kind = "number"
label = { en = "Minutes between updates", ru = "Минут между обновлениями" }
min = 1
max = 1440
default = 5
unit = "min"
