[workspace]
members = ["crates/tessera"]
exclude = ["extensions"]
resolver = "3"

[workspace.package]
version = "0.2.0-dev"
edition = "2024"
repository = "https://github.com/redstone-md/tessera"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Without the default features: they would put the manifest of GPUI into
# the program, which has one of its own (crates/tessera/tessera.manifest).
gpui = { version = "0.2.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["ico", "jpeg", "png"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.9"
toml_edit = "0.25"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
wasmtime = { version = "51", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wit-component = "0.263"
windows-collections = "0.2"
windows = { version = "0.61", features = [
    "ApplicationModel",
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Networking_Connectivity",
    "Storage_Streams",
    "UI_Notifications",
    "UI_Notifications_Management",
    "UI_ViewManagement",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Media_Audio_Endpoints",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

# Full debug info for the dependency graph costs gigabytes of linker and
# compiler memory and is rarely needed while iterating on the shell.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1
