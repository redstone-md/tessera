[workspace]
members = ["crates/tessera"]
exclude = ["extensions", "vendor"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
repository = "https://github.com/redstone-md/tessera"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
async-channel = "2"
# Reads the AutomaticDestinations-ms jump lists, which are compound files.
cfb = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Without the default features: they would put the manifest of GPUI into
# the program, which has one of its own (crates/tessera/tessera.manifest).
gpui = { version = "0.2.2", default-features = false }
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
# Reads Firefox's bookmark backups (.jsonlz4).
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode"] }
qrcodegen = "1.8"
raw-window-handle = "0.6"
regex = "1"
# Reads the manifests of packaged applications for their startup tasks.
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.9"
toml_edit = "0.25"
# Names of Unicode characters for the launcher's unicode runner.
unicode_names2 = "1"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
wasmtime = { version = "51", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wit-component = "0.263"
windows-collections = "0.2"
windows-core = "0.61"
# COM objects of Tessera's own are made with `windows::core::implement`
# (`#[implement(IDropTarget)] struct ...`), which windows-core 0.61 always
# exports; platform/win32/video.rs has one. No feature is needed for it.
windows = { version = "0.61", features = [
    "ApplicationModel",
    "ApplicationModel_DataTransfer",
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Devices_Radios",
    "Foundation",
    "Foundation_Collections",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Management_Deployment",
    "Media_Control",
    "Networking_Connectivity",
    "Networking_NetworkOperators",
    "Networking_Vpn",
    "Storage",
    "Storage_Streams",
    "UI_Notifications",
    "UI_Notifications_Management",
    "UI_ViewManagement",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_NetworkManagement_WNet",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security_Credentials",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_Ioctl",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_RemoteDesktop",
    "Win32_System_RestartManager",
    "Win32_System_Search",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_ProcessStatus",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_Wmi",
    "Win32_UI_Accessibility",
    "Win32_UI_ColorSystem",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

# GPUI as published, with smaller atlas textures: see vendor/gpui/Cargo.toml.
[patch.crates-io]
gpui = { path = "vendor/gpui" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

# Full debug info for the dependency graph costs gigabytes of linker and
# compiler memory and is rarely needed while iterating on the shell.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1
