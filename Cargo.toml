[workspace]
members = ["crates/tessera-core", "crates/tessera-windows", "crates/tessera-ui", "crates/tessera"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.4"
edition = "2024"
rust-version = "1.92"
repository = "https://github.com/redstone-md/tessera"
license = "GPL-3.0-only"
readme = "README.md"

[workspace.dependencies]
tessera-core = { path = "crates/tessera-core" }
tessera-windows = { path = "crates/tessera-windows" }
tessera-ui = { path = "crates/tessera-ui" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-18"] }
slint-build = "=1.18.1"
i-slint-backend-testing = "=1.18.1"
windows-sys = "0.61.2"
windows = "0.62.2"
parking_lot = "0.12.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
winresource = "0.1.31"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
