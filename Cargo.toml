[workspace]
members = ["crates/tessera"]
exclude = ["extensions"]
resolver = "3"

[workspace.package]
version = "0.2.0-dev"
edition = "2024"
repository = "https://github.com/redstone-md/tessera"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui = "0.2.2"
image = { version = "0.25", default-features = false, features = ["ico", "jpeg", "png"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
wasmtime = { version = "51", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wit-component = "0.263"
windows = { version = "0.61", features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

# Full debug info for the dependency graph costs gigabytes of linker and
# compiler memory and is rarely needed while iterating on the shell.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1
